<script>
const D = {"script": "이탈리아산 화장품, 더 믿음 가시죠? 그런데 화장품 공장 세계 1위는 한국 코스맥스입니다. 끝까지 보시면, 배우던 한국 공장이 어떻게 이탈리아 공장의 주인까지 됐는지 아시게 돼요.\n\n싼 인건비 덕도, 한류 덕도 아닙니다. 출발은 1990년대 초, 일본 회사의 기술을 받아 화장품을 만드는 일이었습니다. 그런데 사업 초기에 갈림길이 왔습니다. 일본 기술을 계속 받아 쓸지, 우리 연구소를 따로 세울지요. 코스맥스는 자기 연구소를 택했습니다. 그 연구소가 2015년, 세계 1위 이탈리아 인터코스를 넘어섰습니다. 그럼 1위를 내준 이탈리아 공장은 지금 무너지고 있을까요?\n\n그 답을 보려면, 50년 전 밀라노의 작은 지하 작업장부터 들어가 보셔야 해요.\n\n1972년 이탈리아 밀라노. 스물아홉 살 청년 다리오 페라리가 작은 립스틱 회사 하나를 사들였습니다. 직원은 열 명, 일하는 곳은 건물 지하 작업장이었습니다. 이 회사가 바로 인터코스입니다. 그런데 인터코스는 자기 이름을 단 화장품을 팔지 않았습니다. 다른 회사 이름이 붙을 화장품을 만들었습니다.\n\n이런 걸 위탁생산이라고 합니다. 브랜드 이름은 다른 회사가 붙이고, 만드는 건 이 공장이 하는 겁니다. 동네 마트에 가면 마트 이름이 찍힌 과자가 있죠? 그 과자, 마트가 직접 굽지 않습니다. 큰 과자 회사가 만들어 주고, 마트는 포장에 자기 이름만 올리는 거예요. 화장품도 똑같은 구조입니다.\n\n인터코스는 이 일 하나로 반세기를 지켰습니다. 미국의 패션과 뷰티 전문지는 페라리 집안을 메이크업의 퍼스트 패밀리라고 불렀습니다. 색조 화장품 업계의 첫째 가문이라는 뜻이죠. 창업자는 세계 30대 화장품 회사 가운데 25곳과 거래한다고 말해 왔습니다. 회사 쪽 주장입니다. 그래도 그런 말이 통할 만큼, 이탈리아 공장 이름이 업계에서 무거웠다는 겁니다.\n\n나라 전체로 넓혀 봐도 그래요. 밀라노가 속한 롬바르디아주 한 곳이 이탈리아 화장품 위탁생산의 약 76%를 맡고 있습니다. 열 개 중 여덟 개 가까이가 한 지역에서 나오는 셈이죠. 이탈리아는 남의 화장품을 대신 만들어 주는 일의 본고장이었습니다.\n\n여기서 문제가 있습니다. 이런 나라에서 1위를 가져오려면, 늦게 출발한 쪽이 원조를 넘어야 합니다. 인터코스가 수십 년 쌓은 거래처와 기술, 그리고 이탈리아라는 이름값까지 한꺼번에 따라잡아야 하는 겁니다. 상식으로는 승산이 없는 싸움입니다.\n\n그런데 2015년, 순위가 바뀌었습니다. 한국 회사 코스맥스가 인터코스를 처음으로 넘어섰습니다. 그 뒤로 10년 넘게 1위 자리를 내주지 않았습니다.\n\n먼저 하나 짚고 가겠습니다. 화장품 위탁생산 세계 순위는 누가 공식으로 매긴 게 아닙니다. 각 회사가 공개한 실적을 나란히 놓고 견준 겁니다. 다만 그 비교에서 2015년 뒤로 1위 자리가 바뀌지 않았습니다.\n\n그럼 이유는 뭘까요. 결론부터 말씀드리겠습니다. 코스맥스는 남의 기술을 빌려 쓰는 대신 자기 연구소를 택했습니다. 그리고 화장품 시장이 속도를 요구하기 시작했을 때, 그 연구소가 누구보다 빨리 만들어 냈습니다. 50년 원조 이탈리아가 아니라, 뒤늦게 뛰어든 한국 공장이 그 속도를 먼저 갖춘 겁니다.\n\n화장대 위에 이탈리아나 프랑스 이름이 붙은 화장품, 하나쯤 있으시죠? 그 회사가 자기 공장에서 직접 만들었을 거라고 생각하셨을 거예요.\n\n그런데 그 연구소, 시작은 남의 기술이었습니다. 여기까지는 결과입니다. 진짜 이야기는 그 연구소가 생기던 날부터입니다.\n\n1992년, 대웅제약에서 마케팅 전무를 지낸 이경수 회장이 화장품 회사를 하나 차렸습니다. 첫 이름은 한국미로토였습니다. 이 이름을 1994년에 코스맥스로 바꿨습니다. 출발은 일본 기업과의 기술 제휴였습니다.\n\n기술 제휴가 뭔지 먼저 풀어 드릴게요. 화장품에는 처방이라는 게 있습니다. 어떤 원료를 얼마나, 어떤 순서로 섞을지 적은 설계도입니다. 김치로 치면 집안마다 다른 양념 비율 같은 거죠. 코스맥스는 이 처방과 만드는 공정을 일본 쪽에서 배우는 구조로 시작했습니다. 가르치는 쪽은 일본 기술 제휴사, 배우는 쪽은 코스맥스였습니다.\n\n배우는 쪽이 할 수 있는 일은 많지 않습니다. 받은 처방대로 섞고, 받은 공정대로 기계를 돌리는 겁니다. 처방을 받아 찍어 내기만 하는 공장은 당장은 편합니다. 연구에 돈이 덜 들거든요. 대신 새 제품이 필요할 때마다 또 처방을 받아 와야 합니다. 내 손으로는 새 제품을 못 만드는 거죠.\n\n그런데 사업 초기, 코스맥스 앞에 갈림길이 왔습니다. 일본 기술을 계속 받아 쓸 것이냐, 우리 연구소를 따로 세울 것이냐. 이 회장은 2025년 12월 서울대 북콘서트에서 이 순간을 직접 꺼냈습니다. 일본 기술 제휴를 포기하고 독자 연구소를 세우기로 한 순간이라고요.\n\n제휴를 내려놓으면 당장 배울 곳이 사라집니다. 처방도, 공정도, 기계가 말썽일 때 물어볼 곳도요. 갓 문을 연 회사에게 이건 기술 공급이 끊길 수 있는 선택입니다. 연구소를 세우려면 돈도 사람도 새로 들여야 합니다. 계산기를 두드려 보면 답은 뻔해 보입니다. 하던 대로 일본 기술을 받아 쓰는 겁니다.\n\n그런데 코스맥스는 자기 연구소를 택했습니다. 일본 기술에 기대지 않고, 처방을 직접 쓰는 쪽으로 간 겁니다.\n\n이 회장은 30년쯤 지난 뒤, 이 순간을 가장 용기 있던 선택이었다고 꼽았습니다. 회사를 키우며 내린 수많은 결정 가운데, 이 장면을 맨 앞에 세운 거죠.\n\n오해하시면 안 되는 게 하나 있어요. 이건 일본 쪽을 탓하는 이야기가 아닙니다. 코스맥스는 그 뒤에도 일본 회사와 손잡고 기술 제휴를 맺은 기록이 남아 있습니다. 그러니까 이 장면의 핵심은 누구와 갈라섰느냐가 아닙니다. 무엇을 손에 쥐었느냐입니다. 남의 처방을 받아 쓰는 공장으로 남을지, 자기 처방을 직접 쓰는 회사가 될지. 코스맥스는 뒤쪽을 골랐습니다.\n\n직장에서 이런 고민 해 보신 적 있으세요? 하던 대로 거래처가 주는 일만 받을지, 돈이 들어도 우리 기술을 따로 키울지요. 대부분은 하던 대로 갑니다. 당장 매출이 걸려 있으니까요. 눈앞에 손해가 보이는 쪽을 고르는 게 얼마나 어려운지, 회사 다녀 보신 분들은 다 아실 거예요. 그 자리에서 먼 쪽을 고르는 사장님은 드뭅니다.\n\n그런데 그 선택이 맞았는지는, 나라 전체가 흔들릴 때 판가름 났습니다.\n\n1997년 외환위기, IMF 때입니다. 나라 곳간에 달러가 바닥나서, 멀쩡하던 회사들이 줄줄이 문을 닫던 때죠. 그때 다니던 회사, 그때 집안 사정 기억하시는 분 많으실 거예요.\n\n문을 연 지 다섯 해 된 코스맥스도 그 한가운데 있었습니다. 이 회장은 이 시기를 이렇게 돌아봤습니다. 자체 기술력을 확보했기에 IMF 위기를 극복하고 글로벌 기업으로 도약할 기반을 마련했다고요. 자기 처방이 있으니, 누구 허락을 받지 않고도 새 제품을 내놓을 수 있었던 거죠.\n\n그 힘으로 코스맥스는 2004년, 중국 진출을 결정했습니다. 순서대로 이어 보면 이래요. 자기 기술이 있었고, 그 기술로 외환위기를 넘었고, 그 힘으로 중국에 나갔습니다. 그리고 그 길 끝에 세계 1위가 있었습니다.\n\n그런데 여기서 걸리는 게 있습니다. 상대는 1972년부터 이 일을 해 온 원조입니다. 이탈리아의 강점은 립스틱, 파운데이션 같은 고급 색조 화장품이었습니다. 이름난 고급 브랜드 몇 곳이 시장을 끌고 가는 구조였습니다. 이런 판에서는 오래 거래한 원조 공장이 유리합니다.\n\n그런데 시장이 바뀌었습니다. 고급 브랜드 몇 곳이 이끌던 시장이, 인디 브랜드 중심으로 넘어간 겁니다. 인디 브랜드는 작게 시작한 신생 화장품 브랜드를 말합니다. 이런 브랜드가 공장에 바라는 건 세 가지입니다.\n\n첫째, 빨리. 신제품을 짧은 기간 안에 내놓아야 합니다. 둘째, 조금씩. 처음부터 많이 찍어 낼 돈이 없으니 적게 만들어 봐야 합니다. 셋째, 여러 가지. 이것저것 내놓아 보고, 반응이 오는 제품을 키워야 하죠.\n\n업계 설명대로라면 한국 위탁생산의 강점이 딱 여기입니다. 스킨케어와 선케어, 짧은 개발 기간, 빠른 생산 대응이요. 빨리, 조금씩, 여러 가지. 이 세 가지를 하나로 꿰면 결국 속도입니다. 빨리는 개발 속도고, 조금씩은 생산을 바꾸는 속도고, 여러 가지는 새 처방을 쏟아 내는 속도입니다. 그리고 이 속도는 처방을 직접 쓰는 연구소가 있어야 나옵니다.\n\n고급 색조를 크게 찍어 내던 이탈리아 모델과는 출발점이 달랐던 겁니다. 이탈리아가 못해서 진 게 아닙니다. 시장이 묻는 질문이 바뀌었고, 그 질문에 한국 공장이 먼저 답했습니다. 그렇게 2015년, 이 속도가 순위를 바꿨습니다. 프랑스 화장품 회사 로레알도 코스맥스에 제품을 맡겨 온 오래된 고객사입니다.\n\n화장품 가게에서 처음 보는 브랜드 이름이 확 늘었다고 느끼신 적 있으세요? 그 낯선 이름들 상당수가 바로 이런 공장에서 나옵니다. 브랜드는 작아도, 뒤에서 만드는 공장은 세계 1위인 거죠.\n\n그런데 같은 2015년, 인터코스도 한국 땅에 직접 들어왔습니다.\n\n2015년 12월. 인터코스가 신세계인터내셔날과 손잡고 한국에 회사를 세웠습니다. 이름은 신세계인터코스코리아입니다. 두 회사가 반씩 돈을 내 세운 합작법인입니다.\n\n공장은 경기도 오산에 섰습니다. 2016년 땅을 파기 시작해, 2017년부터 기계를 돌렸습니다. 회사 쪽은 이 법인을 이탈리아의 한국 내 최대 투자기업이라고 소개했습니다. 회사 측 설명입니다. 그래도 방향은 분명하죠. 세계 1위를 지켜 온 회사가, 화장품 위탁생산 회사들이 자라던 한국에 직접 공장을 지은 겁니다. 한국 화장품이 크는 시장 한가운데에 자리를 잡은 거죠.\n\n여기서 일이 하나 터졌습니다. 2018년, 코스맥스와 같은 한국 화장품 위탁생산 회사인 한국콜마의 직원 두 명이 인터코스코리아로 회사를 옮겼습니다. 두 사람은 회사 노트북에 있던 선크림 기술 파일 수백 개를 인터넷 저장 공간에 올려 가져갔습니다.\n\n이 사건, 이탈리아 본사가 한국 기술을 훔친 일로 오해하기 쉬워요.\n\n그건 사실이 아닙니다. 사건의 대상은 이탈리아 본사가 아니라 한국 법인, 인터코스코리아였습니다. 대법원은 2024년 1월, 옮겨 간 직원들의 유죄를 확정했습니다.\n\n법인 쪽도 처벌을 받았습니다. 대법원이 다시 따져 보라고 돌려보낸 재판에서, 인터코스코리아에 벌금 500만 원이 매겨졌습니다. 금액만 놓고 보면 작아요.\n\n하지만 그렇다고 이 일이 가벼워지는 건 아닙니다. 법원이 눈여겨본 숫자가 따로 있었거든요. 인터코스코리아는 2018년 한 해에만 선크림 같은 선케어 제품의 식약처 심사를 44건 끝냈습니다. 한 달에 서너 건꼴이에요. 갓 공장을 돌리기 시작한 회사치고는 너무 빨랐죠. 법원은 이 속도를 이례적이라고 봤습니다. 빼낸 기술로 제품을 만들었다고 판단한 겁니다.\n\n이 장면이 남긴 건 벌금 액수가 아닙니다. 원조 이탈리아 회사의 한국 법인이 한국 선크림 기술을 탐냈다는 사실입니다. 앞서 본 1990년대를 떠올려 보세요. 그때 코스맥스는 일본 기술 제휴사에게 처방을 배우던 자리에 있었습니다. 그로부터 20년 남짓 지나, 한국 공장들은 지켜야 할 기술을 가진 자리에 서 있었습니다. 배우던 자리와 정반대 자리입니다. 순위표 숫자보다 이 장면 하나가 판이 어떻게 바뀌었는지 더 또렷하게 보여 줍니다.\n\n여름에 바르시는 선크림, 어느 나라 제품이 제일 믿음 가세요? 프랑스나 이탈리아 이름이 먼저 떠오르실 수도 있어요. 그런데 원조 이탈리아 회사의 한국 법인이 손에 넣고 싶어 한 건, 한국 공장의 선크림 기술이었습니다.\n\n그리고 2026년 2분기, 두 회사의 거리가 숫자로 드러납니다. 여기서부터는 숫자가 말해 줘요.\n\n2026년 8월, 화장품 위탁생산 회사들이 차례로 2분기 실적을 내놨습니다. 숫자를 보기 전에 기준부터 말씀드리겠습니다. 이 영상의 숫자는 2026년 2분기 기준입니다. 3분기 실적은 2026년 11월 현재 아직 발표 전입니다. 코스맥스는 11월 11일에 내놓을 예정입니다.\n\n코스맥스의 2026년 2분기 매출은 7,949억 원입니다. 1년 전보다 27.5% 늘었고, 분기 매출로는 역대 최대입니다.\n\n같은 분기 인터코스 매출은 원화로 약 4,658억 원입니다. 숫자로만 들으면 감이 잘 안 오시죠. 이렇게 바꿔 볼게요. 인터코스가 1억 원어치를 팔 때, 코스맥스는 1억 7천만 원어치를 판 겁니다. 상자 열 개를 팔 때 열일곱 개를 내보낸 거죠.\n\n이 분기에는 다른 기록도 붙었어요. 코스맥스 한국 법인 매출이 처음으로 5,000억 원을 넘었습니다. 미국 법인은 창사 이래 처음으로 분기 흑자를 냈습니다. 한국에서 키운 연구소의 방식이 바다 건너에서도 통하기 시작했다는 얘기입니다.\n\n순위표에는 한국 회사 이름이 하나 더 보입니다.\n\n화장품 사업을 합친 업계 집계로는 한국콜마도 2026년 1분기부터 인터코스를 앞질렀습니다. 회사마다 화장품 말고 다른 사업이 섞여 있어서, 화장품만 따로 모아 견준 기준입니다.\n\n여기서 착각하면 안 됩니다. 이건 한 회사가 운 좋게 한 번 치고 올라간 이야기가 아닙니다. 2014년까지 순위표 맨 윗줄은 인터코스 혼자였습니다. 2015년 코스맥스가 그 줄에 올라선 뒤로 10년 넘게 자리를 지켰고, 2026년 2분기엔 그 거리가 1.7배까지 벌어졌습니다. 한두 해 반짝한 숫자라면 이렇게 쌓이지 않습니다.\n\n2014년에 누가 이런 말을 했다면 믿으셨겠어요? 화장품 공장 세계 1위 자리를 한국 회사가 10년 넘게 지킨다고요. 대부분 고개를 저으셨을 거예요. 그때만 해도 화장품 하면 프랑스와 이탈리아였으니까요. 그 10년 사이, 순위표는 이렇게 바뀌었습니다.\n\n그런데 진짜 놀라운 장면은 순위표 밖에 있습니다. 대부분 이 뉴스를 그냥 지나치셨을 거예요.\n\n이탈리아 밀라노에서 약 100킬로미터 떨어진 도시, 브레시아. 이곳에 1985년 문을 연 화장품 공장 케미노바가 있습니다. 피부과 화장품, 헤어케어, 의료기기 쪽을 전문으로 만드는 곳입니다. 유기농 인증과 품질 관리 인증도 갖추고 있죠.\n\n하나 분명히 해 두겠습니다. 케미노바는 인터코스와는 전혀 다른 회사입니다. 인터코스 공장이 팔린 게 아닙니다.\n\n2026년 2월, 코스맥스가 케미노바 지분 51%를 사들이는 계약을 맺었습니다. 그리고 같은 해 4월, 인수를 마무리하고 경영권을 쥐었습니다.\n\n이 소식을 확인해 준 건 한국 쪽만이 아닙니다. 이탈리아 정부 기관인 이탈리아 무역공사의 서울무역관이 2026년 7월, 코스맥스가 4월에 인수를 마치고 경영권을 확보했다고 직접 알렸습니다. 우리가 떠들면 자랑입니다. 그런데 저쪽이 인정하면 그건 자료가 됩니다.\n\n케미노바는 코스맥스의 첫 유럽 생산기지입니다. 그전까지 코스맥스는 유럽에서 연구와 영업만 했거든요. 이제는 고객사 제품에 메이드 인 이탈리아를 찍을 수 있게 됐습니다.\n\n케미노바 직원들 입장이 돼 보세요. 한국 회사가 내 공장의 새 주인이 됐습니다. 무엇부터 걱정하실까요? 한국식으로 다 바꾸겠지, 이 걱정이 제일 먼저예요. 일하는 순서도, 사람도, 기계도요. 40년 넘게 이탈리아 방식으로 돌아가던 공장이니까요.\n\n그런데 코스맥스가 먼저 꺼낸 건 기계가 아니었습니다. 사람이었습니다.\n\n첫째, 전 직원을 대상으로 한국-이탈리아 문화 이해 프로그램을 마련했습니다. 새 주인이 일하는 방식을 밀어붙이기 전에, 서로의 일하는 문화부터 알자는 거예요.\n\n둘째, 케미노바 아카데미를 만들기로 했습니다. 기술을 서로 가르치고 서로 배우는 공동 교육 체계입니다. 한국 연구원이 일방적으로 가르치는 자리가 아니라, 이탈리아 기술자들의 방식도 함께 배우는 자리죠.\n\n셋째, 연구 조직을 새로 짜고, 친환경 원료를 함께 연구하기로 했습니다.\n\n케미노바의 CEO 마우로 프란조니는 이번 인수를 두고, 단순한 주주 변경이 아니라 미래를 위한 선택이라고 말했습니다. 새 주인을 맞은 이탈리아 공장의 대표가 직접 한 말입니다.\n\n여기서 앞의 장면 하나를 다시 꺼내 볼게요. 1990년대, 코스맥스는 일본 기술 제휴사에게 처방을 배우던 회사였습니다. 남의 기술을 계속 받아 쓸지, 자기 연구소를 세울지 고민해야 하는 자리였죠. 그때 코스맥스는 배우는 쪽이었습니다.\n\n그로부터 30년쯤 지나, 코스맥스는 이탈리아 공장의 주인이 됐습니다. 이번엔 코스맥스가 방식을 정할 수 있는 자리였습니다. 한국 처방을 그대로 옮겨 심을 수도 있었죠. 그런데 그러지 않았습니다. 같이 배우는 쪽을 택했습니다. 배우던 회사가, 남의 나라 공장에서 가르치고 또 배우는 학교를 열기로 한 거예요. 처방을 받아 쓰던 회사가 처방을 나누는 회사가 됐고, 그 방식은 함께 배우자는 쪽이었습니다.\n\n이 장면을 만든 건 회사 이름 하나가 아닙니다. 1990년대 공장에서 밤새 기계 돌리셨던 분, 기술 배우러 해외 출장 다니셨던 분, 외환위기 때 회사를 지키셨던 분, 수출 서류 들고 뛰셨던 분. 그분들이 한 계단씩 쌓은 시간이 있었습니다. 이탈리아 공장에 새로 붙은 이름표는, 그 세대가 쌓은 경력입니다.\n\n그런데 박수만 치고 끝내기엔, 아직 답하지 않은 질문이 하나 남아 있습니다.\n\n좋은 말로만 마무리하면 그건 정직하지 않은 겁니다. 영상 첫머리에 드린 질문이 있었습니다. 그럼 1위를 내준 이탈리아 공장은 지금 무너지고 있을까요?\n\n답은 아니요입니다. 인터코스는 2026년 2분기에 2분기 기준으로 창사 이래 가장 많은 매출을 올렸습니다. 이탈리아 경제지 텔레보르사가 전한 내용입니다.\n\n2026년 연간 목표도 그대로 지켰습니다. 매출 5~6% 성장이라는 목표를 내리지 않은 겁니다. 고급 색조는 여전히 이탈리아가 강합니다. 인터코스의 메이크업 매출은 2025년에도 늘었습니다.\n\n그렇다면 앞에서 말한 추월은 무엇이었을까요? 이탈리아가 무너진 게 아니었습니다. 한국이 훨씬 빨리 큰 겁니다. 인터코스는 성장 속도에서 추월당한 겁니다. 같은 2분기 인터코스 매출은 1년 전보다 4% 늘었습니다. 그사이 코스맥스는 27.5% 늘었습니다. 둘 다 컸는데, 크는 속도가 몇 배나 달랐던 거죠.\n\n이 김에 두 가지는 바로잡고 가겠습니다. 첫째, 앞서 말씀드린 대로 세계 순위는 공식 순위가 아닙니다. 각 회사가 공개한 실적끼리 견줘 본 겁니다. 둘째, 케미노바는 연 매출 약 180억 원 규모의 작은 공장입니다. 인터코스와도 다른 회사입니다. 이탈리아 화장품 산업이 통째로 팔린 게 아니라는 얘기입니다.\n\n이 두 가지를 빼도 남는 게 있습니다. 상대가 잘하고 있는데도 앞섰다는 사실이요. 그게 진짜 어려운 일 아닐까요? 네, 훨씬 어렵습니다. 쓰러진 상대를 앞지르는 건 누구나 할 수 있어요. 역대 최대 실적을 낸 상대보다 더 빨리 크는 건 아무나 못 합니다.\n\n다음 목표도 있습니다. 이 회장은 2025년 12월, 우리나라가 이르면 3년, 늦어도 5년이면 프랑스를 앞설 거라고 말했습니다.\n\n한국 화장품 수출은 이미 프랑스 다음, 2위 수준입니다. 이탈리아 공장 다음 질문은 프랑스인 셈이죠.\n\n이제 맨 처음 장면으로 돌아가 볼게요.\n\n이탈리아산 화장품, 더 믿음 가신다는 분 많으시죠. 그 믿음 뒤에 이런 순서가 있었습니다. 일본 기술을 받아 쓰는 대신 자기 연구소를 택했고, 그 연구소가 빨리, 조금씩, 여러 가지를 가장 잘 만들었고, 그래서 2015년부터 세계 1위가 됐고, 2026년엔 이탈리아 공장의 주인이 돼 함께 배우는 학교를 열기로 했습니다.\n\n오늘 밤 화장대에서 화장품 하나만 뒤집어 보세요. 뒷면 작은 글씨 가운데 제조업자라고 적힌 이름이 따로 찍힌 제품이 많습니다. 앞면 브랜드 이름과 다른 회사 이름이 나오는 경우도 꽤 있습니다. 그 한 줄을 읽는 눈이 생기면 화장품을 고르는 기준이 달라집니다. 브랜드 이름 대신 만든 회사 이름을 보는 겁니다. 마음에 들었던 제품의 제조업자를 기억해 두시면, 다음에 낯선 브랜드를 고를 때도 같은 회사가 만든 제품을 찾아볼 수 있습니다.\n\n제가 보기엔, 이 역전의 진짜 시작은 2015년이 아니라 자기 연구소를 택한 그날이었습니다.\n\n화장품 뒷면 보셨다면 댓글로 알려 주세요. 코스맥스였나요? 다른 한국 회사였나요? 외국 회사였나요? 댓글이 모이면, 우리가 쓰는 화장품이 실제로 어느 공장에서 만들어지는지 한눈에 보일 거예요.\n\n오늘 이야기는 어떠셨나요?\n\n결과에는 언제나 이유가 있습니다.\n\n그 이유를 알고 나면, 세상이 조금 다르게 보입니다.\n const $ = s => document.querySelector(s);
function el(tag, cls, txt){const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;}
function copyBtn(get){
  const b=el('button','copy','복사'); b.type='button';
  b.addEventListener('click',()=>{
    const t=get(), ok=()=>{b.textContent='복사됨'; b.classList.add('done'); setTimeout(()=>{b.textContent='복사'; b.classList.remove('done')},1600)};
    const fallback=()=>{const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok()}catch(e){b.textContent='직접 선택해 복사하세요'} ta.remove()};
    if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fallback)} else fallback();
  });
  return b;
}
function block(label, text, opts={}){
  const w=el('div','block'), h=el('div','block-head'), l=el('div','label',label);
  if(opts.rec) l.appendChild(el('span','rec','추천'));
  h.append(l, copyBtn(()=>text)); w.appendChild(h);
  w.appendChild(el('p','text'+(opts.cls?' '+opts.cls:''),text));
  return w;
}

th.appendChild(el('h2',null,'이미지 프롬프트'));

const tabs=[...document.querySelectorAll('nav button')];
function show(id){tabs.forEach(b=>{const on=b.dataset.tab===id; b.setAttribute('aria-selected',on); $('#'+b.dataset.tab).hidden=!on}); try{localStorage.setItem('tab',id)}catch(e){}}
