const D = {"up": {"title": "원폭 목표 1순위였는데.. 교토는 어떻게 원자폭탄을 피했을까?｜히로시마 원폭", "desc": "#히로시마원폭, #교토, #원자폭탄, #나가사키, #역사속이유\n\n1945년 5월, 원폭 표적위원회가 가장 높은 등급 AA를 매겨 목록 맨 위에 올린 도시는 교토였습니다. 그런데 원자폭탄은 히로시마와 나가사키에 떨어졌습니다. 표적위원회 기록, 그로브스 회고록, 포츠담 전보와 스팀슨·트루먼의 일기를 따라 교토가 원폭 목록에서 빠진 이유를 날짜순으로 정리합니다.\n\n📌 이 영상에서 다루는 내용\n· 5월 10일, 교토가 목록 맨 위에 오른 이유\n· 신혼여행 이야기와 기록의 차이\n· 「이건 내가 정할 문제요」 육군 장관과 군\n· 포츠담 전보와 「그리고 나가사키」\n\n⏱ 타임스탬프\n00:00 5월 10일, 목록 맨 위의 교토\n00:57 4월 27일, 17개 도시\n01:27 표적을 고른 세 가지 기준\n02:04 AA를 받은 두 도시\n02:40 일흔일곱 살 육군 장관\n03:16 1926년과 1929년의 교토\n03:39 5월 30일, 「이건 내가 정할 문제요」\n05:04 「허락 없이는 안 되는 도시」\n05:29 이유는 세 가지\n07:03 7월 21일, 포츠담의 전보\n08:16 7월 24일, 대통령에게 한 설명\n08:40 같은 날, 세 곳과 네 곳\n09:29 7월 25일, 최종 명령\n09:58 8월 6일, 히로시마\n10:10 8월 9일, 고쿠라로\n11:03 오전 11시 2분, 나가사키\n11:34 전쟁 내내 교토는\n12:08 다시, 5월 10일의 교토\n\n🔗 주요 출처\n\nAtomic Heritage Foundation — 표적위원회 권고(1945년 5월 10~11일 회의 메모)\nhttps://ahf.nuclearmuseum.org/ahf/key-documents/target-committee-recommendations/\n\n미 국무부 외교문서(FRUS) — 포츠담 회담 1945, 해리슨이 스팀슨에게 보낸 전보(7월 21일)\nhttps://history.state.gov/historicaldocuments/frus1945Berlinv02/d1307\n\nNational Security Archive — The Atomic Bomb and the End of World War II (2020)\nhttps://nsarchive.gwu.edu/briefing-book/nuclear-vault/2020-08-04/atomic-bomb-end-world-war-ii\n\nAlex Wellerstein — Henry Stimson didn't go to Kyoto on his honeymoon (2023)\nhttps://blog.nuclearsecrecy.com/2023/07/24/henry-stimson-didnt-go-to-kyoto-on-his-honeymoon/\n\n이 외 그로브스 회고록·스팀슨 1947년 기고·히로시마시·나가사키시 자료 등 20여 건을 참고해 사실 확인을 거쳤습니다.\n\n🔔 역사 속 「왜 그렇게 됐을까」 하나를 날짜와 기록으로 끝까지 풀어 드립니다. 다음 이야기도 구독으로 받아 보세요.", "tags": "#원자폭탄, #히로시마원폭, #나가사키원폭, #교토, #원폭목표, #스팀슨, #트루먼, #포츠담회담, #맨해튼계획, #그로브스, #고쿠라, #태평양전쟁, #2차세계대전, #전쟁사, #역사속이유", "pin": "교토를 목록에서 지운 스팀슨의 결정은 옳은 판단이었다고 보시나요? 여러분의 생각을 댓글로 적어 주세요."}, "titles": [{"t": "원폭 목표 1순위였는데.. 교토는 어떻게 원자폭탄을 피했을까?｜히로시마 원폭", "note": "대본 첫 장면(5월 10일, AA 목록 맨 위)과 바로 이어지고, 「?」까지 34자라 모바일 목록에서 안 잘립니다."}, {"t": "신혼여행 때문이 아니었다.. 교토는 왜 원폭을 피했을까?｜원폭 목표 도시", "note": "48시간 CTR이 낮아 제목을 바꿀 때 — 흔히 알려진 이야기를 바로잡는 쪽을 앞에 세웁니다. 원래 B안(50자)을 길이 기준에 맞춰 40자로 줄였습니다."}, {"t": "군도 끝까지 원했는데.. 교토는 왜 원폭 목록에서 빠졌을까?｜히로시마 원폭", "note": "장관과 그로브스의 밀고 당기기(포츠담 전보)를 앞에 세우고 싶을 때."}], "thumbs": ["원폭 1순위 도시였는데 / 교토만 피한 이유", "장관 한 명이 / 목록에서 지운 도시", "신혼여행이 아니었다 / 교토가 빠진 진짜 이유"], "prompts": [{"label": "1번(추천) — 지도 위에서 지워진 한 점, 교토의 빨간 X", "p": "Dark desaturated topographic map of western Honshu and northern Kyushu, Japan, top-down view, embossed terrain relief with mountain shading and coastlines, aged paper texture, monochrome grey and ink black, no labels, no text, no numbers, no people, soft vignette, lower third left dark and empty. Four small muted grey dots mark coastal cities in the west and north. A single bold hand-painted deep-red (#C62828) X sits over the Kyoto basin in the center of the frame. Empty dark space to the upper right of the X is left clear for a label. Quiet, puzzling mood, strong contrast."}, {"label": "2번 — 책상 위 낡은 지도, 조명이 떨어진 교토의 X", "p": "Oblique low-angle view of an old desaturated paper map of central and western Japan lying on a dark wooden desk, embossed terrain relief, monochrome grey and sepia, no readable text, no numbers, no people. A narrow cone of desk-lamp light falls on the Kyoto area where a single deep-red (#C62828) X is painted. The rest of the map fades into shadow. Lower third dark and empty for text. Tense, quiet atmosphere."}, {"label": "3번 — 줄 그어진 도시 목록 한 줄", "p": "Close-up of a yellowed 1945 typewritten memo on a dark desk, the typed lines blurred and unreadable, one line struck through with a single thick deep-red (#C62828) pencil stroke. The edge of an old monochrome map of Japan peeks out beneath the paper. Low-key lighting, film grain, no readable text, no numbers, no people. Lower third dark and empty. Tense, archival mood."}], "script": "1945년 5월 10일, 미국 뉴멕시코의 로스앨러모스. 원자폭탄을 만든 과학자와 장교들이 한 방에 모여, 첫 폭탄을 떨어뜨릴 일본 도시를 고릅니다. 가장 높은 등급 AA를 받아 목록 맨 위에 오른 곳은 교토였습니다. 인구 100만, 일본의 지적 중심지라는 이유였어요.\n\n석 달 뒤, 원자폭탄은 히로시마와 나가사키에 떨어졌습니다. 교토는 끝까지 무사했어요.\n\n그런데 이상한 점이 있습니다. 원폭 준비를 맡은 미군 장교들은 끝까지 교토를 원했어요. 7월 21일에는 독일 포츠담까지 그 도시를 첫 목표로 쓰고 싶다는 전보가 갔거든요.\n\n더 이상한 건, 교토가 빠진 자리를 채운 도시입니다. 나가사키는 원폭 표적으로 아껴 두던 목록에 한 번도 오른 적이 없는 도시였습니다.\n\n1순위였고, 미군 장교들도 끝까지 원했는데, 교토는 어떻게 원자폭탄을 피했을까요?\n\n오늘은 그 이유를 알아보겠습니다. 이야기는 그해 4월, 미국 국방부 건물 펜타곤의 첫 회의에서 시작됩니다.\n\n4월 27일, 워싱턴의 펜타곤. 원폭을 떨어뜨릴 도시를 고르던 과학자와 장교 모임, 표적위원회가 처음 모였습니다. 이날 후보로 오른 도시는 17곳이었어요.\n\n이 첫 목록에는 나가사키도 들어 있었습니다. 다만 이 이름은 오래 남지 못해요. 다음 달 회의에서 추린 표적 목록에는 나가사키가 없었거든요.\n\n두 번째 회의는 5월 10일부터 이틀 동안, 로스앨러모스에서 열렸습니다. 여기서 표적을 고르는 기준이 세 가지로 정리됐어요.\n\n첫째, 지름 3마일, 그러니까 약 4.8km가 넘는 큰 도시 안의 중요한 표적일 것. 둘째, 폭발의 폭풍으로 잘 부서질 곳일 것.\n\n셋째는 8월까지 공습을 받지 않을 곳이었어요. 원폭을 떨어뜨리기 전에 다른 폭격으로 먼저 부서진 도시는 표적에서 뺀다는 기준이었죠.\n\n위원회 메모의 교토 항목에는 이렇게 적혀 있습니다. 교토는 일본의 옛 수도이고, 다른 도시들이 부서지면서 사람과 공장이 옮겨 오고 있다. 그리고 한 문장이 더 붙어요. 교토는 일본의 지적 중심지라서, 그곳 사람들이 이런 무기의 의미를 더 잘 알아챌 것이다.\n\n위원회가 매긴 가장 높은 등급, AA를 받은 도시는 두 곳이었습니다. 교토와 히로시마예요. 위원회가 적어 낸 순서에서 맨 위에 놓인 이름은 교토였습니다.\n\n5월 중순에는 원폭 표적으로 고른 도시들을 일반 폭격에서 빼 두기로 했어요. 원폭을 위해 아껴 두는 목록이었죠. 이 목록이 정확히 며칠에 만들어졌는지는 기록마다 다릅니다.\n\n5월 28일 세 번째 회의에서도 교토는 여전히 후보 세 곳 가운데 하나였어요. 교토는 위원회가 정한 세 기준을 다 갖춘 곳이었어요.\n\n이 목록은 결국 일흔일곱 살의 육군 장관 앞에 놓이게 됩니다.\n\n그 장관의 이름은 헨리 스팀슨입니다. 미국 육군을 맡은 장관이었고, 원자폭탄 개발 계획을 대통령 아래에서 책임진 사람이었어요.\n\n스팀슨이 이 자리를 맡은 건 처음이 아니었어요. 30여 년 전에도 육군 장관을 지냈고, 그 뒤에는 국무장관도 지냈습니다.\n\n흔히 스팀슨이 젊은 시절 교토로 신혼여행을 다녀왔고, 그 추억 때문에 교토를 살렸다고 알려졌지만, 기록은 다릅니다.\n\n스팀슨이 결혼한 건 1893년이에요. 그런데 그가 처음 아시아에 간 건 1926년, 쉰아홉 살 때였습니다. 결혼하고 한참이 지난 뒤였죠.\n\n교토에는 두 번 들렀습니다. 처음은 그 첫 아시아 여행 때였고, 두 번째는 1929년이었어요. 이때 스팀슨은 필리핀 총독을 마치고, 국무장관이 되려고 미국으로 돌아가던 길이었습니다.\n\n두 번의 짧은 방문이 전부였던 도시를 두고, 스팀슨은 군과 정면으로 맞서게 됩니다. 그 장면은 원자폭탄 개발 책임자의 회고록에 남아 있어요.\n\n5월 30일 아침, 펜타곤의 스팀슨 방. 미국의 원자폭탄 개발 계획, 맨해튼 계획의 책임자인 그로브스 소장이 장관을 찾아왔습니다. 그로브스의 회고록에는 날짜가 없지만, 연구자들은 이날 아침의 일로 봅니다.\n\n그로브스는 회고록에 이렇게 적었습니다. 표적 이야기가 나오자 스팀슨이 이렇게 말했다는 거예요. 이건 내가 직접 정할 문제요. 마셜이 정하는 게 아니오. 마셜은 미국 육군 참모총장이었어요. 그로브스는 참모총장을 건너뛴 꼴이 돼서 무척 불편했다고 적었습니다.\n\n스팀슨은 곧바로 표적 보고서를 가져오라고 했어요. 가져오는 데 시간이 걸린다고 하자, 오전 내내 시간이 있으니 자기 전화로 당장 가져오게 하라고 했죠.\n\n표적 목록을 듣자마자 스팀슨은 교토에 반대했습니다. 승인하지 않겠다는 거였어요. 보고서를 다 읽으면 생각이 바뀔 거라는 말에도, 그렇지 않을 거라고 답했고요.\n\n그로브스에게도 이유가 있었어요. 교토는 인구가 100만이 넘고, 도시가 넓어서 원자폭탄의 효과를 끝까지 알 수 있는 곳이었거든요. 그로브스가 보기에 히로시마는 그 점에서 한참 못 미쳤습니다.\n\n스팀슨이 그로브스에게 든 이유는 달랐어요. 교토는 일본의 옛 수도이고, 일본 사람들에게 종교적으로 큰 의미가 있는 곳이라는 거였죠. 그리고 이 결정은 전쟁이 끝난 뒤 미국이 역사에서 어떤 자리에 서게 될지를 기준으로 내려야 한다고 했습니다.\n\n이틀 뒤, 스팀슨은 폭격을 맡은 육군 항공대의 아널드 장군을 만났어요. 그날 일기에는 이렇게 적었습니다. 내 허락 없이 폭격해서는 안 되는 도시가 하나 있는데, 그게 교토라고 말했다.\n\n그래도 그로브스는 물러서지 않았어요. 그는 회고록에 그 뒤로도 여러 번 교토를 넣자고 했지만, 장관은 단호했다고 적었습니다. 교토 이야기는 7월에 한 번 더 나옵니다.\n\n왜 장관은 그렇게까지 버텼을까요. 이유는 크게 세 가지입니다.\n\n첫째, 마지막 결정을 장관 한 사람이 내렸습니다. 표적위원회는 후보를 추천했을 뿐이에요. 스팀슨은 앞서 본 대로 내가 직접 정할 문제라며 승인을 직접 맡았고, 교토는 승인하지 않았습니다. 그로브스도, 현지 군사 고문들도 그 결정을 바꾸지 못했어요.\n\n둘째, 스팀슨이 기록에 남긴 이유는 전쟁이 끝난 뒤의 일본이었습니다. 옛 수도이자 종교와 문화의 중심지를 부수면, 그 원한이 오래 남는다고 본 거예요. 그 원한 때문에 전쟁이 끝난 뒤 일본이 어느 편에 설지가 달라질 수 있다는 걱정이었죠. 이 걱정은 7월의 일기에 가장 분명하게 적혀 있습니다.\n\n셋째, 대통령도 같은 생각이었습니다. 트루먼 대통령은 스팀슨의 결정에 동의했고, 그 동의는 날짜가 적힌 일기와 전보로 남아 있어요.\n\n교토에 두 번 들렀던 개인적인 인연이 결정에 영향을 줬다고 보는 연구자도 있습니다. 미국의 핵 역사 연구자 앨릭스 웰러스타인은 이렇게 정리했어요. 스팀슨은 여러 이유로 일본을 살릴 수는 없었지만, 교토는 살릴 수 있었다. 다만 다른 글에서는, 그 인연 하나로만 설명하는 건 조금 안이하다고 적었습니다.\n\n스팀슨이 밝힌 이유는 때마다 조금씩 달랐어요. 5월에 그로브스에게는 전쟁 뒤 미국이 역사에서 설 자리를 들었고, 7월에 대통령에게는 소련을 들었습니다.\n\n어느 쪽이든 기록에 남은 건 결정권과 전쟁 뒤의 계산이었어요. 이 세 가지가 문서로 한꺼번에 드러난 건 7월, 독일에서였습니다.\n\n7월 21일, 독일 포츠담. 대통령과 함께 회담에 와 있던 스팀슨에게 전보가 한 통 왔습니다. 보낸 사람은 워싱턴에 남아 원폭 일을 챙기던 장관 보좌관 해리슨이었습니다. 원폭 준비에 참여한 현지 군사 고문들이 모두 장관님의 애착 도시를 원한다는 내용이었죠. 그날 날씨를 보고 고를 수 있다면 첫 목표로 쓰고 싶다는 요청이었어요.\n\n애착 도시는 현지 군사 고문들의 요구를 전한 이 전보에 쓰인 표현입니다. 미국 국무부가 펴낸 외교문서의 편집자는 이 도시가 교토라고 주석을 달았어요.\n\n스팀슨의 답은 같은 날 나갔습니다. 내 결정을 바꿀 요인은 알지 못하오. 오히려 이곳의 새 요인들이 결정을 굳혀 주고 있소.\n\n이튿날, 스팀슨은 트루먼에게 이 문제를 꺼냈어요. 그날 일기에 따르면 대통령은 스팀슨의 생각을 강하게 지지하며, 자기도 같은 생각이라고 했습니다.\n\n23일, 스팀슨은 해리슨에게 다시 전보를 보냈어요. 내가 반대하기로 정한 그곳은 언제나 빼시오. 내 결정은 최고 권위자가 확인했소. 외교문서의 주석에 따르면, 여기서 최고 권위자는 트루먼 대통령입니다.\n\n해리슨의 답에는 새 순서가 적혀 있었어요. 히로시마, 고쿠라, 니가타였습니다.\n\n24일, 스팀슨은 대통령에게 이유를 한 번 더 설명했어요. 그날 일기에는 이렇게 적었습니다. 그곳을 빼지 않으면, 그 원한 때문에 긴 전후 기간 동안 일본인을 소련이 아닌 우리 편으로 돌려세우기가 불가능해질 수 있다. 트루먼은 더없이 힘주어 동의한다고 거듭 말했어요. 둘째 이유와 셋째 이유가 같은 날 일기에 함께 적힌 거예요.\n\n그런데 같은 24일, 문서 두 장의 내용이 서로 다릅니다. 그로브스가 이날 낸 작전 계획서에는 표적이 세 곳이었어요. 히로시마, 고쿠라, 니가타. 같은 날 포츠담으로 간 명령 문안에는 네 곳이 적혀 있었습니다. 마지막 이름이 나가사키였어요.\n\n미국 내셔널지오그래픽은 이 날짜가 적힌 명령 초안에 그리고 나가사키라는 말이 손글씨로 덧붙어 있었다고 보도했습니다.\n\n그로브스는 회고록에 이렇게 적었습니다. 그 표적은 교토 대신 얼마 전에 막 추가된 곳이라, 내가 어쩌다 첨부 문서에 빠뜨린 모양이다.\n\n나가사키는 4월의 첫 목록에는 있었어요. 하지만 원폭 표적으로 아껴 두던 목록에는 끝까지 오르지 않았다고 그로브스는 적었습니다. 미국 쪽 설명으로 나가사키는 큰 조선소와 군항이 있던 도시였어요.\n\n25일, 최종 명령이 나왔습니다. 8월 3일쯤 뒤로 날씨가 맑아 눈으로 목표를 보고 폭격할 수 있게 되면, 히로시마와 고쿠라, 니가타와 나가사키 가운데 한 곳에 첫 폭탄을 떨어뜨린다는 내용이었어요.\n\n같은 날 트루먼은 일기에 이렇게 썼습니다. 우리는 옛 수도에도, 새 수도에도 이 끔찍한 폭탄을 떨어뜨릴 수 없다. 옛 수도는 교토, 새 수도는 도쿄를 가리켜요.\n\n이제 명령서에 적힌 이름들이 실제 비행 순서가 됩니다.\n\n8월 6일, 첫 원자폭탄이 히로시마에 떨어졌습니다. 즉시 숨진 사람만 최소 7만 명이었어요.\n\n히로시마시 집계로, 그해 12월 말까지 숨진 사람은 약 14만 명입니다.\n\n사흘 뒤인 8월 9일, 두 번째 원자폭탄을 실은 B-29 폭격기가 떠났어요. 이번 표적은 두 곳이었습니다. 첫째 표적은 고쿠라, 둘째 표적은 나가사키였어요. 니가타는 다른 두 도시와 너무 멀어서 넣지 않았다고 그로브스는 적었습니다.\n\n명령은 분명했습니다. 기상 보고가 어떻든 고쿠라 상공을 직접 지나며, 눈으로 목표를 보고 떨어뜨리는 폭격이 안 되는지 확인한 뒤에야 다음 표적으로 가라는 거였어요.\n\n폭격기가 고쿠라에 닿은 건 오전 10시가 되기 조금 전이었어요. 그로브스의 기록으로는 적어도 세 번 도시 위로 들어갔고, 그러는 사이 45분쯤이 흘렀습니다. 도시는 짙은 연무와 연기에 가려 있었어요.\n\n무엇이 고쿠라를 가렸는지는 기록마다 다릅니다. 그로브스는 원인이 끝내 밝혀지지 않았다고 적었어요. 전날 가까운 야하타에 있었던 공습의 연기였다는 설명도 있습니다.\n\n폭격기는 나가사키로 방향을 돌렸습니다. 남은 연료로는 나가사키 상공에 한 번밖에 들어갈 수 없었어요. 가장 가까운 미군 비행장이 있는 오키나와까지 날아가야 했거든요.\n\n나가사키도 구름이 두꺼웠습니다. 그로브스의 회고록에 따르면, 마지막 순간 구름 틈으로 목표를 보고 폭탄을 떨어뜨렸어요. 오전 11시 2분이었습니다.\n\n나가사키에서 즉시 숨진 사람은 최소 3만 9천 명이었어요.\n\n그해 말까지 숨진 사람은 약 7만 4천 명으로 집계됩니다.\n\n전쟁이 끝날 때까지 교토에는 원자폭탄도, 큰 공습도 떨어지지 않았어요. 원폭 표적으로 아껴 두는 동안 다른 폭격에서도 빠져 있었기 때문이라고 그로브스는 주장했습니다. 교토의 한 대학 평화박물관도 같은 쪽으로 설명하고요.\n\n그렇다고 교토에 공습이 전혀 없던 건 아니에요. 그해 1월 히가시야마구 마바치에 교토의 첫 공습이 있었고, 30명 넘게 숨졌습니다.\n\n교토를 넣자고 끝까지 요구했던 그로브스는 회고록에 이렇게 적었습니다. 전쟁이 갑자기 끝난 뒤, 내 의견이 꺾인 게 무척 다행이었다.\n\n5월 10일, 로스앨러모스에서 AA를 받고 목록 맨 위에 올랐던 교토가 원자폭탄을 피한 이유는 세 가지였습니다. 첫째, 마지막 결정권이 육군 장관 한 사람에게 있었어요. 둘째, 그 장관이 기록에 남긴 이유는 전쟁이 끝난 뒤의 일본이었습니다. 셋째, 대통령도 같은 생각이었어요.\n\n교토가 빠진 건 운 때문이 아니었습니다. 장관 한 사람이 두 달 동안 그로브스 장군과 현지 장교들의 요구를 거절한 결과였습니다.\n\n스팀슨은 1947년 잡지 하퍼스에 이렇게 적었어요. 트루먼 대통령의 따뜻한 지지를 받아, 나는 제안된 표적 목록에서 교토를 지웠다. 같은 글에서 그는 히로시마와 나가사키를 포함한 네 표적을 승인했다고 밝혔습니다. 그 두 도시에서 피폭된 한국인도 7만 명이 넘는 것으로 추정됩니다.\n\n목록 맨 위에 있던 교토는 7월 25일 최종 명령의 표적에서 빠져 있었어요. 8월, 원자폭탄은 히로시마와 나가사키에 떨어졌고, 교토는 끝까지 표적이 되지 않았습니다. 교토를 원자폭탄 표적으로 쓰려던 계획은 그렇게 끝났습니다.\n\n오늘은 원폭 목표 1순위였던 교토가 어떻게 원자폭탄을 피했는지 알아봤습니다. 교토를 목록에서 지운 스팀슨의 결정은 옳은 판단이었다고 보시나요? 여러분의 생각을 댓글로 적어 주세요.\n\n지금까지 역사 속 이유였습니다.", "paras": ["1945년 5월 10일, 미국 뉴멕시코의 로스앨러모스. 원자폭탄을 만든 과학자와 장교들이 한 방에 모여, 첫 폭탄을 떨어뜨릴 일본 도시를 고릅니다. 가장 높은 등급 AA를 받아 목록 맨 위에 오른 곳은 교토였습니다. 인구 100만, 일본의 지적 중심지라는 이유였어요.", "석 달 뒤, 원자폭탄은 히로시마와 나가사키에 떨어졌습니다. 교토는 끝까지 무사했어요.", "그런데 이상한 점이 있습니다. 원폭 준비를 맡은 미군 장교들은 끝까지 교토를 원했어요. 7월 21일에는 독일 포츠담까지 그 도시를 첫 목표로 쓰고 싶다는 전보가 갔거든요.", "더 이상한 건, 교토가 빠진 자리를 채운 도시입니다. 나가사키는 원폭 표적으로 아껴 두던 목록에 한 번도 오른 적이 없는 도시였습니다.", "1순위였고, 미군 장교들도 끝까지 원했는데, 교토는 어떻게 원자폭탄을 피했을까요?", "오늘은 그 이유를 알아보겠습니다. 이야기는 그해 4월, 미국 국방부 건물 펜타곤의 첫 회의에서 시작됩니다.", "4월 27일, 워싱턴의 펜타곤. 원폭을 떨어뜨릴 도시를 고르던 과학자와 장교 모임, 표적위원회가 처음 모였습니다. 이날 후보로 오른 도시는 17곳이었어요.", "이 첫 목록에는 나가사키도 들어 있었습니다. 다만 이 이름은 오래 남지 못해요. 다음 달 회의에서 추린 표적 목록에는 나가사키가 없었거든요.", "두 번째 회의는 5월 10일부터 이틀 동안, 로스앨러모스에서 열렸습니다. 여기서 표적을 고르는 기준이 세 가지로 정리됐어요.", "첫째, 지름 3마일, 그러니까 약 4.8km가 넘는 큰 도시 안의 중요한 표적일 것. 둘째, 폭발의 폭풍으로 잘 부서질 곳일 것.", "셋째는 8월까지 공습을 받지 않을 곳이었어요. 원폭을 떨어뜨리기 전에 다른 폭격으로 먼저 부서진 도시는 표적에서 뺀다는 기준이었죠.", "위원회 메모의 교토 항목에는 이렇게 적혀 있습니다. 교토는 일본의 옛 수도이고, 다른 도시들이 부서지면서 사람과 공장이 옮겨 오고 있다. 그리고 한 문장이 더 붙어요. 교토는 일본의 지적 중심지라서, 그곳 사람들이 이런 무기의 의미를 더 잘 알아챌 것이다.", "위원회가 매긴 가장 높은 등급, AA를 받은 도시는 두 곳이었습니다. 교토와 히로시마예요. 위원회가 적어 낸 순서에서 맨 위에 놓인 이름은 교토였습니다.", "5월 중순에는 원폭 표적으로 고른 도시들을 일반 폭격에서 빼 두기로 했어요. 원폭을 위해 아껴 두는 목록이었죠. 이 목록이 정확히 며칠에 만들어졌는지는 기록마다 다릅니다.", "5월 28일 세 번째 회의에서도 교토는 여전히 후보 세 곳 가운데 하나였어요. 교토는 위원회가 정한 세 기준을 다 갖춘 곳이었어요.", "이 목록은 결국 일흔일곱 살의 육군 장관 앞에 놓이게 됩니다.", "그 장관의 이름은 헨리 스팀슨입니다. 미국 육군을 맡은 장관이었고, 원자폭탄 개발 계획을 대통령 아래에서 책임진 사람이었어요.", "스팀슨이 이 자리를 맡은 건 처음이 아니었어요. 30여 년 전에도 육군 장관을 지냈고, 그 뒤에는 국무장관도 지냈습니다.", "흔히 스팀슨이 젊은 시절 교토로 신혼여행을 다녀왔고, 그 추억 때문에 교토를 살렸다고 알려졌지만, 기록은 다릅니다.", "스팀슨이 결혼한 건 1893년이에요. 그런데 그가 처음 아시아에 간 건 1926년, 쉰아홉 살 때였습니다. 결혼하고 한참이 지난 뒤였죠.", "교토에는 두 번 들렀습니다. 처음은 그 첫 아시아 여행 때였고, 두 번째는 1929년이었어요. 이때 스팀슨은 필리핀 총독을 마치고, 국무장관이 되려고 미국으로 돌아가던 길이었습니다.", "두 번의 짧은 방문이 전부였던 도시를 두고, 스팀슨은 군과 정면으로 맞서게 됩니다. 그 장면은 원자폭탄 개발 책임자의 회고록에 남아 있어요.", "5월 30일 아침, 펜타곤의 스팀슨 방. 미국의 원자폭탄 개발 계획, 맨해튼 계획의 책임자인 그로브스 소장이 장관을 찾아왔습니다. 그로브스의 회고록에는 날짜가 없지만, 연구자들은 이날 아침의 일로 봅니다.", "그로브스는 회고록에 이렇게 적었습니다. 표적 이야기가 나오자 스팀슨이 이렇게 말했다는 거예요. 이건 내가 직접 정할 문제요. 마셜이 정하는 게 아니오. 마셜은 미국 육군 참모총장이었어요. 그로브스는 참모총장을 건너뛴 꼴이 돼서 무척 불편했다고 적었습니다.", "스팀슨은 곧바로 표적 보고서를 가져오라고 했어요. 가져오는 데 시간이 걸린다고 하자, 오전 내내 시간이 있으니 자기 전화로 당장 가져오게 하라고 했죠.", "표적 목록을 듣자마자 스팀슨은 교토에 반대했습니다. 승인하지 않겠다는 거였어요. 보고서를 다 읽으면 생각이 바뀔 거라는 말에도, 그렇지 않을 거라고 답했고요.", "그로브스에게도 이유가 있었어요. 교토는 인구가 100만이 넘고, 도시가 넓어서 원자폭탄의 효과를 끝까지 알 수 있는 곳이었거든요. 그로브스가 보기에 히로시마는 그 점에서 한참 못 미쳤습니다.", "스팀슨이 그로브스에게 든 이유는 달랐어요. 교토는 일본의 옛 수도이고, 일본 사람들에게 종교적으로 큰 의미가 있는 곳이라는 거였죠. 그리고 이 결정은 전쟁이 끝난 뒤 미국이 역사에서 어떤 자리에 서게 될지를 기준으로 내려야 한다고 했습니다.", "이틀 뒤, 스팀슨은 폭격을 맡은 육군 항공대의 아널드 장군을 만났어요. 그날 일기에는 이렇게 적었습니다. 내 허락 없이 폭격해서는 안 되는 도시가 하나 있는데, 그게 교토라고 말했다.", "그래도 그로브스는 물러서지 않았어요. 그는 회고록에 그 뒤로도 여러 번 교토를 넣자고 했지만, 장관은 단호했다고 적었습니다. 교토 이야기는 7월에 한 번 더 나옵니다.", "왜 장관은 그렇게까지 버텼을까요. 이유는 크게 세 가지입니다.", "첫째, 마지막 결정을 장관 한 사람이 내렸습니다. 표적위원회는 후보를 추천했을 뿐이에요. 스팀슨은 앞서 본 대로 내가 직접 정할 문제라며 승인을 직접 맡았고, 교토는 승인하지 않았습니다. 그로브스도, 현지 군사 고문들도 그 결정을 바꾸지 못했어요.", "둘째, 스팀슨이 기록에 남긴 이유는 전쟁이 끝난 뒤의 일본이었습니다. 옛 수도이자 종교와 문화의 중심지를 부수면, 그 원한이 오래 남는다고 본 거예요. 그 원한 때문에 전쟁이 끝난 뒤 일본이 어느 편에 설지가 달라질 수 있다는 걱정이었죠. 이 걱정은 7월의 일기에 가장 분명하게 적혀 있습니다.", "셋째, 대통령도 같은 생각이었습니다. 트루먼 대통령은 스팀슨의 결정에 동의했고, 그 동의는 날짜가 적힌 일기와 전보로 남아 있어요.", "교토에 두 번 들렀던 개인적인 인연이 결정에 영향을 줬다고 보는 연구자도 있습니다. 미국의 핵 역사 연구자 앨릭스 웰러스타인은 이렇게 정리했어요. 스팀슨은 여러 이유로 일본을 살릴 수는 없었지만, 교토는 살릴 수 있었다. 다만 다른 글에서는, 그 인연 하나로만 설명하는 건 조금 안이하다고 적었습니다.", "스팀슨이 밝힌 이유는 때마다 조금씩 달랐어요. 5월에 그로브스에게는 전쟁 뒤 미국이 역사에서 설 자리를 들었고, 7월에 대통령에게는 소련을 들었습니다.", "어느 쪽이든 기록에 남은 건 결정권과 전쟁 뒤의 계산이었어요. 이 세 가지가 문서로 한꺼번에 드러난 건 7월, 독일에서였습니다.", "7월 21일, 독일 포츠담. 대통령과 함께 회담에 와 있던 스팀슨에게 전보가 한 통 왔습니다. 보낸 사람은 워싱턴에 남아 원폭 일을 챙기던 장관 보좌관 해리슨이었습니다. 원폭 준비에 참여한 현지 군사 고문들이 모두 장관님의 애착 도시를 원한다는 내용이었죠. 그날 날씨를 보고 고를 수 있다면 첫 목표로 쓰고 싶다는 요청이었어요.", "애착 도시는 현지 군사 고문들의 요구를 전한 이 전보에 쓰인 표현입니다. 미국 국무부가 펴낸 외교문서의 편집자는 이 도시가 교토라고 주석을 달았어요.", "스팀슨의 답은 같은 날 나갔습니다. 내 결정을 바꿀 요인은 알지 못하오. 오히려 이곳의 새 요인들이 결정을 굳혀 주고 있소.", "이튿날, 스팀슨은 트루먼에게 이 문제를 꺼냈어요. 그날 일기에 따르면 대통령은 스팀슨의 생각을 강하게 지지하며, 자기도 같은 생각이라고 했습니다.", "23일, 스팀슨은 해리슨에게 다시 전보를 보냈어요. 내가 반대하기로 정한 그곳은 언제나 빼시오. 내 결정은 최고 권위자가 확인했소. 외교문서의 주석에 따르면, 여기서 최고 권위자는 트루먼 대통령입니다.", "해리슨의 답에는 새 순서가 적혀 있었어요. 히로시마, 고쿠라, 니가타였습니다.", "24일, 스팀슨은 대통령에게 이유를 한 번 더 설명했어요. 그날 일기에는 이렇게 적었습니다. 그곳을 빼지 않으면, 그 원한 때문에 긴 전후 기간 동안 일본인을 소련이 아닌 우리 편으로 돌려세우기가 불가능해질 수 있다. 트루먼은 더없이 힘주어 동의한다고 거듭 말했어요. 둘째 이유와 셋째 이유가 같은 날 일기에 함께 적힌 거예요.", "그런데 같은 24일, 문서 두 장의 내용이 서로 다릅니다. 그로브스가 이날 낸 작전 계획서에는 표적이 세 곳이었어요. 히로시마, 고쿠라, 니가타. 같은 날 포츠담으로 간 명령 문안에는 네 곳이 적혀 있었습니다. 마지막 이름이 나가사키였어요.", "미국 내셔널지오그래픽은 이 날짜가 적힌 명령 초안에 그리고 나가사키라는 말이 손글씨로 덧붙어 있었다고 보도했습니다.", "그로브스는 회고록에 이렇게 적었습니다. 그 표적은 교토 대신 얼마 전에 막 추가된 곳이라, 내가 어쩌다 첨부 문서에 빠뜨린 모양이다.", "나가사키는 4월의 첫 목록에는 있었어요. 하지만 원폭 표적으로 아껴 두던 목록에는 끝까지 오르지 않았다고 그로브스는 적었습니다. 미국 쪽 설명으로 나가사키는 큰 조선소와 군항이 있던 도시였어요.", "25일, 최종 명령이 나왔습니다. 8월 3일쯤 뒤로 날씨가 맑아 눈으로 목표를 보고 폭격할 수 있게 되면, 히로시마와 고쿠라, 니가타와 나가사키 가운데 한 곳에 첫 폭탄을 떨어뜨린다는 내용이었어요.", "같은 날 트루먼은 일기에 이렇게 썼습니다. 우리는 옛 수도에도, 새 수도에도 이 끔찍한 폭탄을 떨어뜨릴 수 없다. 옛 수도는 교토, 새 수도는 도쿄를 가리켜요.", "이제 명령서에 적힌 이름들이 실제 비행 순서가 됩니다.", "8월 6일, 첫 원자폭탄이 히로시마에 떨어졌습니다. 즉시 숨진 사람만 최소 7만 명이었어요.", "히로시마시 집계로, 그해 12월 말까지 숨진 사람은 약 14만 명입니다.", "사흘 뒤인 8월 9일, 두 번째 원자폭탄을 실은 B-29 폭격기가 떠났어요. 이번 표적은 두 곳이었습니다. 첫째 표적은 고쿠라, 둘째 표적은 나가사키였어요. 니가타는 다른 두 도시와 너무 멀어서 넣지 않았다고 그로브스는 적었습니다.", "명령은 분명했습니다. 기상 보고가 어떻든 고쿠라 상공을 직접 지나며, 눈으로 목표를 보고 떨어뜨리는 폭격이 안 되는지 확인한 뒤에야 다음 표적으로 가라는 거였어요.", "폭격기가 고쿠라에 닿은 건 오전 10시가 되기 조금 전이었어요. 그로브스의 기록으로는 적어도 세 번 도시 위로 들어갔고, 그러는 사이 45분쯤이 흘렀습니다. 도시는 짙은 연무와 연기에 가려 있었어요.", "무엇이 고쿠라를 가렸는지는 기록마다 다릅니다. 그로브스는 원인이 끝내 밝혀지지 않았다고 적었어요. 전날 가까운 야하타에 있었던 공습의 연기였다는 설명도 있습니다.", "폭격기는 나가사키로 방향을 돌렸습니다. 남은 연료로는 나가사키 상공에 한 번밖에 들어갈 수 없었어요. 가장 가까운 미군 비행장이 있는 오키나와까지 날아가야 했거든요.", "나가사키도 구름이 두꺼웠습니다. 그로브스의 회고록에 따르면, 마지막 순간 구름 틈으로 목표를 보고 폭탄을 떨어뜨렸어요. 오전 11시 2분이었습니다.", "나가사키에서 즉시 숨진 사람은 최소 3만 9천 명이었어요.", "그해 말까지 숨진 사람은 약 7만 4천 명으로 집계됩니다.", "전쟁이 끝날 때까지 교토에는 원자폭탄도, 큰 공습도 떨어지지 않았어요. 원폭 표적으로 아껴 두는 동안 다른 폭격에서도 빠져 있었기 때문이라고 그로브스는 주장했습니다. 교토의 한 대학 평화박물관도 같은 쪽으로 설명하고요.", "그렇다고 교토에 공습이 전혀 없던 건 아니에요. 그해 1월 히가시야마구 마바치에 교토의 첫 공습이 있었고, 30명 넘게 숨졌습니다.", "교토를 넣자고 끝까지 요구했던 그로브스는 회고록에 이렇게 적었습니다. 전쟁이 갑자기 끝난 뒤, 내 의견이 꺾인 게 무척 다행이었다.", "5월 10일, 로스앨러모스에서 AA를 받고 목록 맨 위에 올랐던 교토가 원자폭탄을 피한 이유는 세 가지였습니다. 첫째, 마지막 결정권이 육군 장관 한 사람에게 있었어요. 둘째, 그 장관이 기록에 남긴 이유는 전쟁이 끝난 뒤의 일본이었습니다. 셋째, 대통령도 같은 생각이었어요.", "교토가 빠진 건 운 때문이 아니었습니다. 장관 한 사람이 두 달 동안 그로브스 장군과 현지 장교들의 요구를 거절한 결과였습니다.", "스팀슨은 1947년 잡지 하퍼스에 이렇게 적었어요. 트루먼 대통령의 따뜻한 지지를 받아, 나는 제안된 표적 목록에서 교토를 지웠다. 같은 글에서 그는 히로시마와 나가사키를 포함한 네 표적을 승인했다고 밝혔습니다. 그 두 도시에서 피폭된 한국인도 7만 명이 넘는 것으로 추정됩니다.", "목록 맨 위에 있던 교토는 7월 25일 최종 명령의 표적에서 빠져 있었어요. 8월, 원자폭탄은 히로시마와 나가사키에 떨어졌고, 교토는 끝까지 표적이 되지 않았습니다. 교토를 원자폭탄 표적으로 쓰려던 계획은 그렇게 끝났습니다.", "오늘은 원폭 목표 1순위였던 교토가 어떻게 원자폭탄을 피했는지 알아봤습니다. 교토를 목록에서 지운 스팀슨의 결정은 옳은 판단이었다고 보시나요? 여러분의 생각을 댓글로 적어 주세요.", "지금까지 역사 속 이유였습니다."], "ts": "00:00 5월 10일, 목록 맨 위의 교토\n00:57 4월 27일, 17개 도시\n01:27 표적을 고른 세 가지 기준\n02:04 AA를 받은 두 도시\n02:40 일흔일곱 살 육군 장관\n03:16 1926년과 1929년의 교토\n03:39 5월 30일, 「이건 내가 정할 문제요」\n05:04 「허락 없이는 안 되는 도시」\n05:29 이유는 세 가지\n07:03 7월 21일, 포츠담의 전보\n08:16 7월 24일, 대통령에게 한 설명\n08:40 같은 날, 세 곳과 네 곳\n09:29 7월 25일, 최종 명령\n09:58 8월 6일, 히로시마\n10:10 8월 9일, 고쿠라로\n11:03 오전 11시 2분, 나가사키\n11:34 전쟁 내내 교토는\n12:08 다시, 5월 10일의 교토"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = []; // 복사 원문
function btn(text, label){ store.push(text); return `<button class="copy" data-i="${store.length-1}" type="button">${label||'복사'}</button>`; }
function block(title, text, opts={}){
  return `<div class="block"><div class="bhead"><h2>${title}</h2>${btn(text, opts.label)}</div>
  <div class="body"><p class="pre ${opts.mono?'mono':''}">${esc(text)}</p></div></div>`;
}
$('#h-title').textContent = D.up.title;
const chars = D.script.replace(/\n/g,'').length;
$('#stats').innerHTML = [`${chars.toLocaleString()}자`, `약 ${Math.round(chars/470)}분 (470자/분)`, `챕터 ${D.ts.split('\n').length}개`].map(s=>`<span class="stat">${s}</span>`).join('');

$('#p-upload').innerHTML =
  block('제목', D.up.title) + block('설명글', D.up.desc) + block('태그', D.up.tags) + block('고정 댓글', D.up.pin);

document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if(!b) return;
  const text = store[+b.dataset.i], old = b.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(_) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){} ta.remove();
  }
  b.textContent = '복사됨'; b.classList.add('done');
  setTimeout(()=>{ b.textContent = old; b.classList.remove('done'); }, 1400);
});

const tabs = [...document.querySelectorAll('[role=tab]')];
function show(id){
  tabs.forEach(t=>{ const on = t.id===id; t.setAttribute('aria-selected', on); document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
  try{ localStorage.setItem('tab', id); }catch(_){}
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.id)));
try{ const s = localStorage.getItem('tab'); if(s && document.getElementById(s)) show(s); }catch(_){}
</script>
