machine gun team near the Chongchon River in North Korea (November 1950).jpg\")", "tags": "#청천강전투, #덕천전투, #625전쟁, #한국전쟁, #국군2군단, #크리스마스공세, #중공군2차공세, #군우리전투, #맥아더, #펑더화이, #유엔군철수, #장진호, #평양철수, #역사속이유", "pin": "만약 국군 2군단 옆의 64km가 비어 있지 않았다면, 그 하루는 달라졌을까요? 여러분의 생각을 댓글로 적어 주세요."}, "titles": [{"t": "크리스마스엔 집에 간다던 총공세.. 국군 2군단은 왜 하루 만에 무너졌을까?｜덕천 전투", "note": "「크리스마스 공세」라는 아는 이름과 「하루 만에」의 어긋남이 바로 들립니다 (48자)"}, {"t": "장진호 이틀 전.. 중공군은 왜 국군 2군단부터 노렸을까?｜청천강 전투", "note": "장진호 영상을 본 시청자를 끌어올 때. 첫 제목의 CTR이 낮으면 바꿔 볼 후보 (39자)"}, {"t": "적은 5만이라고 봤다.. 국군 2군단은 왜 하루 만에 무너졌을까?｜1950년 덕천", "note": "「정보 실패」에 관심 있는 시청자 쪽으로 바꿀 때 (45자)"}], "thumbs": ["총공세 이틀째였는데 / 2군단이 하루 만에 무너진 이유", "적을 5만으로 봤는데 / 하루 만에 전선이 접힌 이유", "옆은 64km가 비어 있었다 / 국군 2군단이 무너진 이유"], "prompts": [{"label": "1번 — (추천·훅 장면) 긴 전선의 맨 오른쪽 끝, 덕천 자리에만 빨간 구멍", "p": "Dark desaturated topographic military map of northwestern North Korea, top-down view, showing the Ch'ongch'on River valley running from northeast to southwest with rugged Taebaek mountain ridges to the east in embossed relief. A thin faint grey front line stretches west to east across the upper half of the frame, and only at its far right eastern end, deep in the mountains, a single small crimson red (#C62828) hole burns through the paper. Everything else stays monochrome grey and ink black, aged paper texture, soft vignette, mysterious and quiet."}, {"label": "2번 — 위성 사진 톤 산지, 끊긴 전선 끝의 빨간 점과 텅 빈 동쪽 산줄기", "p": "Monochrome satellite-photo style relief map of snow-dusted mountains in North Korea, high contrast grayscale, a river valley on the left side and dense mountain ridges filling the right side. A faint dotted front line ends abruptly at the right, where one crimson red (#C62828) circular gap marks the line's last point, and beyond it to the east the mountains stand completely empty. Upper half holds the line and the red mark, ominous calm atmosphere."}, {"label": "3번 — 누런 작전 지도, 동쪽 산속에서 남서로 휘어 강가 길을 끊는 빨간 화살표", "p": "Aged yellowed paper military operations map, top-down view, hand-drawn terrain shading in ink black, a river flowing southwest across the left half. A single bold crimson red (#C62828) arrow starts from a point deep in the eastern mountains and curves southwest through the valleys to stop just south of a river crossing on the left, cutting across a road. No other markings, tense and ominous mood, strong contrast between the red arrow and the muted paper."}, {"label": "4번 — 흑백 지형 위 길 하나를 가로막는 빨간 화살표, 끝에 균열", "p": "Dark grey embossed relief map of mountainous terrain with a single pale road winding north to south along a river valley. A thick crimson red (#C62828) arrow sweeps in from the eastern mountains and its tip lands squarely across the road, with fine cracks spreading in the paper around the arrowhead. Monochrome everything except the arrow, dramatic shadows, tension."}, {"label": "5번 — (자유안) 겨울 산길에 끊어진 야전 전화선 — 「소식이 끊겼다」", "p": "Black and white archival-style photograph of a frozen mountain road in winter 1950 Korea, a wooden telegraph pole leaning at the roadside with a snapped field telephone wire hanging loose into the snow. Low grey sky, bare hills, no people, grainy film texture, a single tiny crimson red (#C62828) tag tied to the broken wire end as the only color. Quiet, unsettling mood."}], "ts": "00:00 11월 24일, 지도 맨 오른쪽 끝 덕천\n01:03 10월 25일, 온정에서 큰 손실을 입은 6사단\n02:15 비어 있던 64km\n02:32 11월 24일, 하루 1.6km\n03:04 적은 5만 4천 명이라는 보고\n03:40 25일 오후 5시, 덕천\n04:35 자정에야 닿은 소식\n05:01 26일 오전 8시\n05:39 26일 정오, 전선이 접히다\n06:28 5만 4천에서 10만 1천으로\n06:39 이유 하나, 가장 약한 곳을 골랐다\n07:24 이유 둘, 손실을 입은 군단과 빈 옆자리\n08:02 이유 셋, 보이지 않은 적\n08:49 27일, 구역을 넘기다\n09:14 28일 아침, 14시간을 걸어온 삼소리\n10:32 11월 30일, 군우리에서 순천으로\n11:21 12월 5일, 평양을 내주다\n11:39 숫자로 남지 않은 손실", "script": "1950년 11월 24일 아침, 청천강. 유엔군 총사령관 맥아더가 도쿄에서 날아와 총공세의 첫날을 지켜봅니다. 그날 성명에는 이 공격이 성공하면 사실상 전쟁이 끝난다고 적었어요. 그래서 이 공세는 흔히 크리스마스엔 집에 간다는 공세로 불립니다. 그날 미 8군의 작전 지도를 펴 보면, 전선의 맨 오른쪽 끝에 산골 도시 하나가 있습니다. 덕천이요. 그 앞을 국군 2군단이 맡고 있었습니다.\n\n그런데 이상한 점이 있습니다. 공세 이틀째까지 이 군단은 앞으로 나아가고 있었어요. 사상자도 많지 않았고요.\n\n더 이상한 건 그다음입니다. 이틀째 저녁 다섯 시에 공격을 받았는데, 다음 날 정오 무렵 군단 전선 전체가 무너졌습니다. 그리고 열흘이 채 지나기 전에 유엔군은 평양을 내주고 물러났어요.\n\n공격하던 쪽이었고 전날까지 앞으로 가던 군단이었는데, 국군 2군단은 왜 하루 만에 무너졌을까요?\n\n오늘은 그 이유를 알아보겠습니다. 이야기는 한 달 전, 10월 말에서 시작됩니다.\n\n10월 25일, 온정 부근. 중국 인민지원군, 우리가 흔히 중공군이라 부르는 부대가 처음으로 크게 공격해 왔습니다. 이 첫 공세에서 가장 크게 손실을 입은 부대가 국군 6사단이었어요. 사단은 연대 세 개로 이뤄진 부대예요.\n\n6사단의 한 연대는 병사 대부분이 끝내 청천강 쪽으로 빠져나왔습니다. 하지만 조직된 부대로서는 끝난 상태였죠.\n\n그 뒤 중공군은 싸움을 멈추고 산속으로 물러났어요. 그러고는 한동안 눈에 잘 띄지 않았죠. 그래서 유엔군은 중공군의 규모를 작게 봤습니다.\n\n이제 총공세 전날의 지도를 말로 그려 보면 이렇습니다. 청천강은 북동쪽에서 남서쪽으로 흘러요. 그 강을 따라 서쪽부터 미군 군단 둘이 섰고, 강 동쪽 산속 끝에 국군 2군단이 섰어요. 군단은 사단 서너 개를 묶은 부대인데, 이 군단은 6사단과 7사단, 8사단으로 이뤄져 있었습니다.\n\n미 8군 전선에서 동쪽 끝 절반쯤은 태백 산지로 들어가는 험한 땅이었어요. 국군 2군단이 맡은 곳이 바로 그쪽이었죠.\n\n군단의 중심은 덕천이라는 산골 도시였습니다. 서쪽 청천강 가의 군우리에서 직선으로 약 35km 동쪽이에요.\n\n그 오른쪽, 동해 쪽에는 미 10군단이 있었어요. 그런데 두 부대 사이 산악 지대에는 아무 부대도 없었습니다. 이 틈은 흔히 80km로 알려졌지만, 미국 공식 전사에는 약 64km로 적혀 있어요. 이 영상은 64km를 따릅니다.\n\n그 상태로, 24일 아침 총공세가 시작됩니다.\n\n공세 첫날, 국군 2군단은 앞줄의 두 사단을 앞세워 북쪽으로 나아갔습니다. 청천강 골짜기 길의 동쪽, 산지를 넘어가는 임무였죠.\n\n첫날 두 사단이 나아간 거리는 많아야 1.6km였어요. 군단 왼쪽 끝에서는 한 연대가 백령천에 닿아, 서쪽의 미군 사단과 이어졌습니다. 연대는 사단을 이루는 수천 명 규모의 부대예요.\n\n이튿날에도 군단은 적의 저항을 받으면서 조금 더 나아갔고, 사상자도 많지 않았습니다.\n\n그날 8군 정보참모부가 올린 최종 보고가 있어요. 정보참모부는 적이 얼마나 되는지 셈하는 참모 부서인데, 이 보고에서 8군 앞의 중공군은 5만 4천 명이었죠. 공세 전 추정과 거의 같은 숫자였습니다.\n\n같은 날 도쿄의 극동군 사령부는 정보 요약에 한 가지를 더 적었어요. 중공군이 압록강 쪽으로, 또는 국경 너머로 물러나는 징후가 일부 보인다는 내용이었습니다. 공격 이틀째에도 유엔군 사령부는 적이 물러날 수도 있다고 보고 있었던 거예요.\n\n그리고 그 보고가 올라간 날 저녁, 덕천 앞 산에서 공격이 시작됩니다.\n\n25일 오후 5시, 덕천. 중공군 38군이 덕천을 지키던 국군 7사단을 공격했습니다. 같은 날 저녁, 다른 중공군 부대는 덕천 동쪽 용동리 쪽의 국군 8사단을 쳤어요.\n\n용동리 동쪽의 연대 쪽에서 올라온 보고에는, 적 가운데 말을 탄 기병이 100명쯤 있다는 내용도 들어 있었죠.\n\n7사단 정면에서는 중공군 113사단이 수색중대를 깨뜨렸습니다. 그러고는 두 사단 사이에 틈을 냈어요. 맞닿아 있어야 할 자리가 벌어진 거예요.\n\n그 틈으로 밤새 중공군이 들어왔습니다. 미국 공식 전사에 따르면 연대 두 개 규모가 사단 진지 한가운데로 스며들었어요. 진지 앞이 아니라 진지 안쪽에 적이 들어와 있었던 거죠.\n\n그날 밤 추위 속의 장면도 기록에 남았습니다. 미국 역사가 애플먼은, 8사단 지휘소 근처에서 국군이 추위를 견디려고 피운 모닥불을 따라 중공군이 다가왔다고 적었어요.\n\n이 시각 군단 사령부는 어땠을까요. 군단장 유재흥 소장이 전방 소식을 받은 건 자정이었습니다. 애플먼은 이때가 중공군이 국군 뒤쪽으로 들어온 지 5시간이 지난 뒤였다고 봤어요. 그사이 군단 사령부에는 앞에서 무슨 일이 벌어지는지가 제대로 닿지 않았던 거예요.\n\n이 다섯 시간의 공백은 뒤에서 이유 하나로 다시 나옵니다. 그리고 26일 아침 여덟 시가 됩니다.\n\n26일 오전 8시. 미국 공식 전사는 이 시각, 군단 정면 전체에 강한 압박이 걸렸다고 적었습니다. 군단 동쪽 끝의 연대는 진지를 버리고 용동리로 물러났어요. 서쪽 끝의 연대는 옆 미 9군단 구역으로 밀려났고요.\n\n오전 늦게는 중공군이 남쪽 덕천까지 내려왔습니다. 식량과 탄약이 오가는 큰길, 주보급로가 여기서 끊겼죠. 미국 공식 전사에 따르면, 덕천 안에 있던 6사단의 연대는 그 안에 갇혔어요.\n\n이 연대는 군단의 예비였습니다. 예비는 앞에 세우지 않고 뒤에 남겨 둔 부대로, 앞이 뚫리면 그 자리를 막는 데 써요.\n\n미국 공식 전사는 이날을 이렇게 적었습니다. 26일 정오 무렵, 국군 2군단의 전선은 접혔다. 군단이 맡은 전선이 더는 하나로 이어진 선으로 남지 못했다는 기록이죠.\n\n오후 내내 군단장 유재흥 소장은 덕천과 용동리 사이에 새 방어선을 세우려 했어요. 하지만 미국 공식 전사에 따르면 이 시도는 끊긴 통신과 뒤엉킨 후퇴, 계속된 적의 압박 때문에 이뤄지지 않았습니다.\n\n덕천이 언제 완전히 넘어갔는지는 기록마다 다릅니다. 미국 공식 전사는 해 질 무렵 중공군이 덕천 일대를 완전히 장악했다고 적었어요. 중국 측 기록은 저녁 7시 무렵 덕천의 국군 대부분을 섬멸했다고 적었고요. 이 영상은 해 질 무렵으로 봅니다.\n\n북동쪽에서는 중공군이 용동리를 넘어 남쪽 맹산까지 내려왔어요. 그리고 그날 밤, 8군 정보참모부는 중공군 추정치를 고쳤습니다. 5만 4천에서 10만 1천으로요. 전날 보고에서 하루 만에 두 배 가까이 늘린 거죠.\n\n왜 이렇게 빨랐을까요. 이유는 크게 세 가지입니다.\n\n첫째, 공격하는 쪽이 가장 약한 곳을 골랐습니다. 중국 측 기록과 미국 연구자 패트릭 로의 연구를 보면, 덕천과 용동리를 친 중공군의 계획은 이랬어요. 유엔군 오른쪽 끝의 국군 2군단을 먼저 깨고, 그다음 유엔군 뒤로 돌아 들어간다는 계획이었죠. 패트릭 로는 중공군이 이 군단을 8군에서 가장 약한 부대로 봤다고 적었어요.\n\n다만 이 대목은 기록마다 다릅니다. 미국 공식 전사는 중공군의 주된 공격이 미 9군단 쪽이었고, 국군 쪽은 보조 공격이었다고 봤어요. 이 영상은 중국 측과 연구자의 기록을 따릅니다. 어느 쪽이든, 가장 먼저 무너진 건 국군 2군단이었고요.\n\n둘째, 군단이 선 자리의 조건입니다. 이 군단은 이미 한 번 큰 손실을 입은 군단이었어요. 앞서 본 온정의 손실 때문에, 6사단이 군단 예비로 내놓을 수 있는 건 연대 하나뿐이었죠. 화력도 모자랐습니다. 애플먼은 국군 사단들에게 미군 사단만 한 화력이 없었다고 봤어요.\n\n게다가 군단이 맡은 곳은 8군 전선에서 가장 험한 태백 산지 쪽 끝이었어요. 그리고 그 끝의 오른쪽 옆은 64km가 비어 있었죠. 군단 왼쪽에는 미군 군단이 있었지만, 오른쪽에는 아무도 없었습니다. 오른쪽이 뚫리면 옆에서 막아 줄 이웃 부대가 없었던 거예요.\n\n셋째, 적이 제대로 보이지 않았습니다. 앞서 본 대로 공격 직전 8군이 셈한 중공군은 5만 4천 명이었어요. 연구자들이 보는 그때 서부 전선의 실제 중공군은 약 15만 명이었고요.\n\n이 15만도 서류상 정원으로는 23만 명인 부대였어요. 어느 숫자로 보든, 8군은 앞에 있는 적을 실제의 절반 이하로 보고 부대를 세워 두었습니다.\n\n막상 공격이 오자 이번에는 소식이 늦었어요. 군단장에게 전방 소식이 닿기까지 다섯 시간이 걸렸죠. 다음 날 오후의 새 방어선도 끊긴 통신과 뒤엉킨 후퇴 속에 세워지지 않았습니다. 적을 작게 본 데다, 싸움이 벌어진 뒤에는 앞의 사정이 뒤로 제때 전해지지 않았던 거예요.\n\n이 세 가지가 맞았다는 건, 이틀 뒤 군우리 남쪽에서 드러납니다.\n\n27일, 8사단 사령부와 연대 하나는 맹산을 벗어나 전장을 떠났습니다. 그날 저녁 미 8군 사령관 워커는 군단 구역을 다시 나눴어요. 국군 2군단이 맡던 구역을 미 9군단에 넘긴 거예요. 미국 공식 전사는 이 무렵의 국군 2군단을 사실상 없어진 군단이라고 적었죠. 덕천과 군우리 사이의 와원에서는 터키 여단이 군우리로 오는 길을 막아섰고요.\n\n그날 밤, 덕천 남쪽에서 중공군 113사단이 산길을 따라 남서쪽으로 출발했습니다. 중국 측 기록에는 14시간 동안 걸었다고 나옵니다.\n\n걸은 거리는 기록마다 조금씩 달라요. 중국 측 기록에 70여km에서 72.5km까지 적혀 있어서, 이 영상은 72km 안팎으로 봅니다. 덕천에서 삼소리까지는 직선으로 약 37km예요. 산길을 따라 그 두 배 가까이를 걸은 거죠.\n\n28일 아침, 이 사단은 군우리 바로 남쪽의 삼소리에 닿았습니다. 군우리의 미군이 남쪽으로 물러날 때 지나야 하는 길목이었어요. 도착 시각은 오전 7시라는 기록과 8시 무렵이라는 기록이 함께 있어서, 이 영상은 아침으로만 적습니다. 중국 측 기록에는 그때 미군이 이 부대를 북쪽에서 내려오는 국군으로 여겼다고 적혀 있어요.\n\n같은 날 맥아더는 미 합참에 전문을 보냈습니다. 우리는 완전히 새로운 전쟁을 맞고 있다. 사흘 전만 해도 유엔군 사령부가 압록강 쪽으로 물러날 수도 있다고 보던 적이었어요.\n\n오른쪽 끝 군단 자리가 무너진 뒤, 중공군은 그곳을 지나 유엔군의 뒤쪽까지 들어왔어요. 가장 약한 곳을 먼저 깨고 뒤로 돈다는 계획이, 덕천에서 시작해 삼소리에서 이뤄진 거죠.\n\n이제 서쪽의 유엔군 전체가 물러나야 했습니다.\n\n29일 밤 늦게, 워커는 전 부대에 철수를 명령했습니다. 이튿날, 미 2사단은 군우리에서 남쪽 순천으로 가는 길을 따라 내려갔어요. 그런데 그 길 가운데 10km 가까운 구간 양쪽 산에 중공군이 자리를 잡고 있었죠.\n\n미군은 뒤에 이 골짜기를 건틀릿이라고 불렀습니다. 양쪽 산 위에서 쏘는 총탄 사이를 차량 행렬이 멈추지 못하고 지나가야 했던 길이었어요. 이 사단의 11월 후반 전투 사상자는 기록마다 달라서, 미국 공식 전사는 4,940명, 미국 역사가 애플먼은 4,037명으로 적었어요. 이 영상은 한쪽을 고르지 않고 두 숫자를 함께 적습니다.\n\n12월 1일, 중국 인민지원군 사령관 펑더화이는 직접 쓴 전보 끝에 38군 만세라는 구절을 넣었어요. 중국 측 기록에 남은 문장입니다.\n\n12월 5일 아침, 유엔군은 평양을 내주고 대동강의 마지막 다리를 폭파했습니다. 후퇴는 거기서 멈추지 않았어요. 청천강에서 38선까지, 유엔군이 물러난 길은 모두 약 190km였습니다. 흔히 미군 역사에서 가장 긴 후퇴로 불리는 길이었죠.\n\n그렇다면 이 모든 일의 처음, 국군 2군단의 손실은 어떻게 기록됐을까요.\n\n24일 아침, 맥아더가 지켜본 총공세 첫날의 지도를 다시 펴 보면, 맨 오른쪽 끝에 덕천이 있었습니다. 그 덕천에서 국군 2군단이 무너진 이유는 세 가지였어요.\n\n첫째, 중공군은 가장 약하다고 본 이 군단을 먼저 골랐어요. 둘째, 그 자리는 한 달 전 큰 손실을 입은 군단이 가장 험한 끝에서, 오른쪽 옆 64km가 빈 채로 지키던 곳이었죠. 셋째, 8군은 적을 실제의 절반 이하로 봤고, 공격이 오자 소식은 제때 닿지 않았습니다.\n\n그 하루 동안 국군 2군단이 얼마나 잃었는지는 미국 기록에 숫자로 남지 않았습니다. 미국 역사가 애플먼은, 한국군 기록이 남아 있지 않아 국군 손실은 추정조차 할 수 없다고 적었어요. 미국 공식 전사에 남은 것은, 12월 초 7사단과 8사단이 절반쯤만 다시 모였다는 기록 정도입니다.\n\n이 군단이 하루 만에 무너진 건 병사들이 약해서가 아니었습니다. 그 군단이 서 있던 자리와, 적을 실제보다 훨씬 적게 셈한 숫자 때문이었어요.\n\n24일 시작된 총공세는 이틀 뒤 정오, 전선 오른쪽 끝에서 무너졌습니다. 28일 아침에는 중공군이 군우리 남쪽 삼소리에서 유엔군이 물러날 길을 막았어요. 그리고 12월 5일, 유엔군은 평양을 내주고 남쪽으로 물러났죠. 크리스마스엔 집에 간다던 총공세는 그렇게 끝났습니다.\n\n오늘은 크리스마스 총공세 이틀째, 국군 2군단이 왜 하루 만에 무너졌는지 알아봤습니다. 만약 이 군단 옆의 64km가 비어 있지 않았다면, 그 하루는 달라졌을까요? 여러분의 생각을 댓글로 적어 주세요.\n\n지금까지 역사 속 이유였습니다.", "paras": ["1950년 11월 24일 아침, 청천강. 유엔군 총사령관 맥아더가 도쿄에서 날아와 총공세의 첫날을 지켜봅니다. 그날 성명에는 이 공격이 성공하면 사실상 전쟁이 끝난다고 적었어요. 그래서 이 공세는 흔히 크리스마스엔 집에 간다는 공세로 불립니다. 그날 미 8군의 작전 지도를 펴 보면, 전선의 맨 오른쪽 끝에 산골 도시 하나가 있습니다. 덕천이요. 그 앞을 국군 2군단이 맡고 있었습니다.", "그런데 이상한 점이 있습니다. 공세 이틀째까지 이 군단은 앞으로 나아가고 있었어요. 사상자도 많지 않았고요.", "더 이상한 건 그다음입니다. 이틀째 저녁 다섯 시에 공격을 받았는데, 다음 날 정오 무렵 군단 전선 전체가 무너졌습니다. 그리고 열흘이 채 지나기 전에 유엔군은 평양을 내주고 물러났어요.", "공격하던 쪽이었고 전날까지 앞으로 가던 군단이었는데, 국군 2군단은 왜 하루 만에 무너졌을까요?", "오늘은 그 이유를 알아보겠습니다. 이야기는 한 달 전, 10월 말에서 시작됩니다.", "10월 25일, 온정 부근. 중국 인민지원군, 우리가 흔히 중공군이라 부르는 부대가 처음으로 크게 공격해 왔습니다. 이 첫 공세에서 가장 크게 손실을 입은 부대가 국군 6사단이었어요. 사단은 연대 세 개로 이뤄진 부대예요.", "6사단의 한 연대는 병사 대부분이 끝내 청천강 쪽으로 빠져나왔습니다. 하지만 조직된 부대로서는 끝난 상태였죠.", "그 뒤 중공군은 싸움을 멈추고 산속으로 물러났어요. 그러고는 한동안 눈에 잘 띄지 않았죠. 그래서 유엔군은 중공군의 규모를 작게 봤습니다.", "이제 총공세 전날의 지도를 말로 그려 보면 이렇습니다. 청천강은 북동쪽에서 남서쪽으로 흘러요. 그 강을 따라 서쪽부터 미군 군단 둘이 섰고, 강 동쪽 산속 끝에 국군 2군단이 섰어요. 군단은 사단 서너 개를 묶은 부대인데, 이 군단은 6사단과 7사단, 8사단으로 이뤄져 있었습니다.", "미 8군 전선에서 동쪽 끝 절반쯤은 태백 산지로 들어가는 험한 땅이었어요. 국군 2군단이 맡은 곳이 바로 그쪽이었죠.", "군단의 중심은 덕천이라는 산골 도시였습니다. 서쪽 청천강 가의 군우리에서 직선으로 약 35km 동쪽이에요.", "그 오른쪽, 동해 쪽에는 미 10군단이 있었어요. 그런데 두 부대 사이 산악 지대에는 아무 부대도 없었습니다. 이 틈은 흔히 80km로 알려졌지만, 미국 공식 전사에는 약 64km로 적혀 있어요. 이 영상은 64km를 따릅니다.", "그 상태로, 24일 아침 총공세가 시작됩니다.", "공세 첫날, 국군 2군단은 앞줄의 두 사단을 앞세워 북쪽으로 나아갔습니다. 청천강 골짜기 길의 동쪽, 산지를 넘어가는 임무였죠.", "첫날 두 사단이 나아간 거리는 많아야 1.6km였어요. 군단 왼쪽 끝에서는 한 연대가 백령천에 닿아, 서쪽의 미군 사단과 이어졌습니다. 연대는 사단을 이루는 수천 명 규모의 부대예요.", "이튿날에도 군단은 적의 저항을 받으면서 조금 더 나아갔고, 사상자도 많지 않았습니다.", "그날 8군 정보참모부가 올린 최종 보고가 있어요. 정보참모부는 적이 얼마나 되는지 셈하는 참모 부서인데, 이 보고에서 8군 앞의 중공군은 5만 4천 명이었죠. 공세 전 추정과 거의 같은 숫자였습니다.", "같은 날 도쿄의 극동군 사령부는 정보 요약에 한 가지를 더 적었어요. 중공군이 압록강 쪽으로, 또는 국경 너머로 물러나는 징후가 일부 보인다는 내용이었습니다. 공격 이틀째에도 유엔군 사령부는 적이 물러날 수도 있다고 보고 있었던 거예요.", "그리고 그 보고가 올라간 날 저녁, 덕천 앞 산에서 공격이 시작됩니다.", "25일 오후 5시, 덕천. 중공군 38군이 덕천을 지키던 국군 7사단을 공격했습니다. 같은 날 저녁, 다른 중공군 부대는 덕천 동쪽 용동리 쪽의 국군 8사단을 쳤어요.", "용동리 동쪽의 연대 쪽에서 올라온 보고에는, 적 가운데 말을 탄 기병이 100명쯤 있다는 내용도 들어 있었죠.", "7사단 정면에서는 중공군 113사단이 수색중대를 깨뜨렸습니다. 그러고는 두 사단 사이에 틈을 냈어요. 맞닿아 있어야 할 자리가 벌어진 거예요.", "그 틈으로 밤새 중공군이 들어왔습니다. 미국 공식 전사에 따르면 연대 두 개 규모가 사단 진지 한가운데로 스며들었어요. 진지 앞이 아니라 진지 안쪽에 적이 들어와 있었던 거죠.", "그날 밤 추위 속의 장면도 기록에 남았습니다. 미국 역사가 애플먼은, 8사단 지휘소 근처에서 국군이 추위를 견디려고 피운 모닥불을 따라 중공군이 다가왔다고 적었어요.", "이 시각 군단 사령부는 어땠을까요. 군단장 유재흥 소장이 전방 소식을 받은 건 자정이었습니다. 애플먼은 이때가 중공군이 국군 뒤쪽으로 들어온 지 5시간이 지난 뒤였다고 봤어요. 그사이 군단 사령부에는 앞에서 무슨 일이 벌어지는지가 제대로 닿지 않았던 거예요.", "이 다섯 시간의 공백은 뒤에서 이유 하나로 다시 나옵니다. 그리고 26일 아침 여덟 시가 됩니다.", "26일 오전 8시. 미국 공식 전사는 이 시각, 군단 정면 전체에 강한 압박이 걸렸다고 적었습니다. 군단 동쪽 끝의 연대는 진지를 버리고 용동리로 물러났어요. 서쪽 끝의 연대는 옆 미 9군단 구역으로 밀려났고요.", "오전 늦게는 중공군이 남쪽 덕천까지 내려왔습니다. 식량과 탄약이 오가는 큰길, 주보급로가 여기서 끊겼죠. 미국 공식 전사에 따르면, 덕천 안에 있던 6사단의 연대는 그 안에 갇혔어요.", "이 연대는 군단의 예비였습니다. 예비는 앞에 세우지 않고 뒤에 남겨 둔 부대로, 앞이 뚫리면 그 자리를 막는 데 써요.", "미국 공식 전사는 이날을 이렇게 적었습니다. 26일 정오 무렵, 국군 2군단의 전선은 접혔다. 군단이 맡은 전선이 더는 하나로 이어진 선으로 남지 못했다는 기록이죠.", "오후 내내 군단장 유재흥 소장은 덕천과 용동리 사이에 새 방어선을 세우려 했어요. 하지만 미국 공식 전사에 따르면 이 시도는 끊긴 통신과 뒤엉킨 후퇴, 계속된 적의 압박 때문에 이뤄지지 않았습니다.", "덕천이 언제 완전히 넘어갔는지는 기록마다 다릅니다. 미국 공식 전사는 해 질 무렵 중공군이 덕천 일대를 완전히 장악했다고 적었어요. 중국 측 기록은 저녁 7시 무렵 덕천의 국군 대부분을 섬멸했다고 적었고요. 이 영상은 해 질 무렵으로 봅니다.", "북동쪽에서는 중공군이 용동리를 넘어 남쪽 맹산까지 내려왔어요. 그리고 그날 밤, 8군 정보참모부는 중공군 추정치를 고쳤습니다. 5만 4천에서 10만 1천으로요. 전날 보고에서 하루 만에 두 배 가까이 늘린 거죠.", "왜 이렇게 빨랐을까요. 이유는 크게 세 가지입니다.", "첫째, 공격하는 쪽이 가장 약한 곳을 골랐습니다. 중국 측 기록과 미국 연구자 패트릭 로의 연구를 보면, 덕천과 용동리를 친 중공군의 계획은 이랬어요. 유엔군 오른쪽 끝의 국군 2군단을 먼저 깨고, 그다음 유엔군 뒤로 돌아 들어간다는 계획이었죠. 패트릭 로는 중공군이 이 군단을 8군에서 가장 약한 부대로 봤다고 적었어요.", "다만 이 대목은 기록마다 다릅니다. 미국 공식 전사는 중공군의 주된 공격이 미 9군단 쪽이었고, 국군 쪽은 보조 공격이었다고 봤어요. 이 영상은 중국 측과 연구자의 기록을 따릅니다. 어느 쪽이든, 가장 먼저 무너진 건 국군 2군단이었고요.", "둘째, 군단이 선 자리의 조건입니다. 이 군단은 이미 한 번 큰 손실을 입은 군단이었어요. 앞서 본 온정의 손실 때문에, 6사단이 군단 예비로 내놓을 수 있는 건 연대 하나뿐이었죠. 화력도 모자랐습니다. 애플먼은 국군 사단들에게 미군 사단만 한 화력이 없었다고 봤어요.", "게다가 군단이 맡은 곳은 8군 전선에서 가장 험한 태백 산지 쪽 끝이었어요. 그리고 그 끝의 오른쪽 옆은 64km가 비어 있었죠. 군단 왼쪽에는 미군 군단이 있었지만, 오른쪽에는 아무도 없었습니다. 오른쪽이 뚫리면 옆에서 막아 줄 이웃 부대가 없었던 거예요.", "셋째, 적이 제대로 보이지 않았습니다. 앞서 본 대로 공격 직전 8군이 셈한 중공군은 5만 4천 명이었어요. 연구자들이 보는 그때 서부 전선의 실제 중공군은 약 15만 명이었고요.", "이 15만도 서류상 정원으로는 23만 명인 부대였어요. 어느 숫자로 보든, 8군은 앞에 있는 적을 실제의 절반 이하로 보고 부대를 세워 두었습니다.", "막상 공격이 오자 이번에는 소식이 늦었어요. 군단장에게 전방 소식이 닿기까지 다섯 시간이 걸렸죠. 다음 날 오후의 새 방어선도 끊긴 통신과 뒤엉킨 후퇴 속에 세워지지 않았습니다. 적을 작게 본 데다, 싸움이 벌어진 뒤에는 앞의 사정이 뒤로 제때 전해지지 않았던 거예요.", "이 세 가지가 맞았다는 건, 이틀 뒤 군우리 남쪽에서 드러납니다.", "27일, 8사단 사령부와 연대 하나는 맹산을 벗어나 전장을 떠났습니다. 그날 저녁 미 8군 사령관 워커는 군단 구역을 다시 나눴어요. 국군 2군단이 맡던 구역을 미 9군단에 넘긴 거예요. 미국 공식 전사는 이 무렵의 국군 2군단을 사실상 없어진 군단이라고 적었죠. 덕천과 군우리 사이의 와원에서는 터키 여단이 군우리로 오는 길을 막아섰고요.", "그날 밤, 덕천 남쪽에서 중공군 113사단이 산길을 따라 남서쪽으로 출발했습니다. 중국 측 기록에는 14시간 동안 걸었다고 나옵니다.", "걸은 거리는 기록마다 조금씩 달라요. 중국 측 기록에 70여km에서 72.5km까지 적혀 있어서, 이 영상은 72km 안팎으로 봅니다. 덕천에서 삼소리까지는 직선으로 약 37km예요. 산길을 따라 그 두 배 가까이를 걸은 거죠.", "28일 아침, 이 사단은 군우리 바로 남쪽의 삼소리에 닿았습니다. 군우리의 미군이 남쪽으로 물러날 때 지나야 하는 길목이었어요. 도착 시각은 오전 7시라는 기록과 8시 무렵이라는 기록이 함께 있어서, 이 영상은 아침으로만 적습니다. 중국 측 기록에는 그때 미군이 이 부대를 북쪽에서 내려오는 국군으로 여겼다고 적혀 있어요.", "같은 날 맥아더는 미 합참에 전문을 보냈습니다. 우리는 완전히 새로운 전쟁을 맞고 있다. 사흘 전만 해도 유엔군 사령부가 압록강 쪽으로 물러날 수도 있다고 보던 적이었어요.", "오른쪽 끝 군단 자리가 무너진 뒤, 중공군은 그곳을 지나 유엔군의 뒤쪽까지 들어왔어요. 가장 약한 곳을 먼저 깨고 뒤로 돈다는 계획이, 덕천에서 시작해 삼소리에서 이뤄진 거죠.", "이제 서쪽의 유엔군 전체가 물러나야 했습니다.", "29일 밤 늦게, 워커는 전 부대에 철수를 명령했습니다. 이튿날, 미 2사단은 군우리에서 남쪽 순천으로 가는 길을 따라 내려갔어요. 그런데 그 길 가운데 10km 가까운 구간 양쪽 산에 중공군이 자리를 잡고 있었죠.", "미군은 뒤에 이 골짜기를 건틀릿이라고 불렀습니다. 양쪽 산 위에서 쏘는 총탄 사이를 차량 행렬이 멈추지 못하고 지나가야 했던 길이었어요. 이 사단의 11월 후반 전투 사상자는 기록마다 달라서, 미국 공식 전사는 4,940명, 미국 역사가 애플먼은 4,037명으로 적었어요. 이 영상은 한쪽을 고르지 않고 두 숫자를 함께 적습니다.", "12월 1일, 중국 인민지원군 사령관 펑더화이는 직접 쓴 전보 끝에 38군 만세라는 구절을 넣었어요. 중국 측 기록에 남은 문장입니다.", "12월 5일 아침, 유엔군은 평양을 내주고 대동강의 마지막 다리를 폭파했습니다. 후퇴는 거기서 멈추지 않았어요. 청천강에서 38선까지, 유엔군이 물러난 길은 모두 약 190km였습니다. 흔히 미군 역사에서 가장 긴 후퇴로 불리는 길이었죠.", "그렇다면 이 모든 일의 처음, 국군 2군단의 손실은 어떻게 기록됐을까요.", "24일 아침, 맥아더가 지켜본 총공세 첫날의 지도를 다시 펴 보면, 맨 오른쪽 끝에 덕천이 있었습니다. 그 덕천에서 국군 2군단이 무너진 이유는 세 가지였어요.", "첫째, 중공군은 가장 약하다고 본 이 군단을 먼저 골랐어요. 둘째, 그 자리는 한 달 전 큰 손실을 입은 군단이 가장 험한 끝에서, 오른쪽 옆 64km가 빈 채로 지키던 곳이었죠. 셋째, 8군은 적을 실제의 절반 이하로 봤고, 공격이 오자 소식은 제때 닿지 않았습니다.", "그 하루 동안 국군 2군단이 얼마나 잃었는지는 미국 기록에 숫자로 남지 않았습니다. 미국 역사가 애플먼은, 한국군 기록이 남아 있지 않아 국군 손실은 추정조차 할 수 없다고 적었어요. 미국 공식 전사에 남은 것은, 12월 초 7사단과 8사단이 절반쯤만 다시 모였다는 기록 정도입니다.", "이 군단이 하루 만에 무너진 건 병사들이 약해서가 아니었습니다. 그 군단이 서 있던 자리와, 적을 실제보다 훨씬 적게 셈한 숫자 때문이었어요.", "24일 시작된 총공세는 이틀 뒤 정오, 전선 오른쪽 끝에서 무너졌습니다. 28일 아침에는 중공군이 군우리 남쪽 삼소리에서 유엔군이 물러날 길을 막았어요. 그리고 12월 5일, 유엔군은 평양을 내주고 남쪽으로 물러났죠. 크리스마스엔 집에 간다던 총공세는 그렇게 끝났습니다.", "오늘은 크리스마스 총공세 이틀째, 국군 2군단이 왜 하루 만에 무너졌는지 알아봤습니다. 만약 이 군단 옆의 64km가 비어 있지 않았다면, 그 하루는 달라졌을까요? 여러분의 생각을 댓글로 적어 주세요.", "지금까지 역사 속 이유였습니다."]};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = []; // 복사 원문
function btn(text, label){ store.push(text); return `<button class="copy" data-i="${store.length-1}" type="button">${label||'복사'}</button>`; }
function block(title, text, opts={}){
  return `<div class="block"><div class="bhead"><h2>${title}</h2>${btn(text, opts.label)}</div>
  <div class="body"><p class="pre ${opts.mono?'mono':''}">${esc(text)}</p></div></div>`;
}
$('#h-title').textContent = D.up.title;
const chars = D.script.replace(/\n/g,'').length;
$('#stats').innerHTML = [`${chars.toLocaleString()}자`, `약 ${Math.round(chars/470)}분 (470자/분)`, `챕터 ${D.ts.split('\n').length}개`].map(s=>`<span class="stat">${s}</span>`).join('');

$('#p-upload').innerHTML =
  block('제목', D.up.title) + block('설명글', D.up.desc) + block('태그', D.up.tags) + block('고정 댓글', D.up.pin);

$('#p-thumb').innerHTML =
  `<div class="block"><div class="bhead"><h2>제목 후보</h2></div><div class="list">${
    D.titles.map((x,i)=>`<div class="row"><div class="txt">${i===0?'<span class="tag">추천 · 대본 기준</span>':''}<div class="t">${esc(x.t)}</div><div class="n">${esc(x.note)}</div></div>${btn(x.t)}</div>`).join('')
  }</div></div>
  <div class="block"><div class="bhead"><h2>썸네일 문구</h2></div><div class="list">${
    D.thumbs.map((x,i)=>`<div class="row"><div class="txt">${i===0?'<span class="tag">추천</span>':''}<div class="t">${esc(x)}</div></div>${btn(x)}</div>`).join('')
  }</div></div>
  <p class="note">윗줄 흰색 · 아랫줄 노랑, 빨간 라벨은 「1950.11.26」. 지도 배경만 AI로 만들고 빨간 구멍·글자는 편집 프로그램에서 얹습니다.</p>
  <div class="block"><div class="bhead"><h2>이미지 프롬프트</h2></div><div class="list">${
    D.prompts.map(x=>`<details><summary>${esc(x.label)}</summary><div class="row"><p class="prompt pre txt">${esc(x.p)}</p>${btn(x.p)}</div></details>`).join('')
  }</div></div>`;

$('#p-ts').innerHTML =
  `<p class="note">완성 영상(13분 25초)을 전사해 맞춘 실측 시각입니다.</p>` +
  block('챕터 목록', D.ts, {mono:true, label:'전체 복사'});

$('#p-script').innerHTML =
  `<div class="block"><div class="bhead"><h2>대본 전문 · 01_대본.txt</h2>${btn(D.script,'전문 복사')}</div>
   <div class="body script">${D.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`;

document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if(!b) return;
  const text = store[+b.dataset.i], old = b.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(_) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){} ta.remove();
  }
  b.textContent = '복사됨'; b.classList.add('done');
  setTimeout(()=>{ b.textContent = old; b.classList.remove('done'); }, 1400);
});

const tabs = [...document.querySelectorAll('[role=tab]')];
function show(id){
  tabs.forEach(t=>{ const on = t.id===id; t.setAttribute('aria-selected', on); document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
  try{ localStorage.setItem('tab', id); }catch(_){}
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.id)));
try{ const s = localStorage.getItem('tab'); if(s && document.getElementById(s)) show(s); }catch(_){}
</script>
