<script>
const D = {"up": {"title": "포로에게 붙잡힌 미군 장군.. 왜 78시간 동안 구하지 못했을까? | 1952년 거제도 도드 사건", "desc": "#거제포로수용소, #625전쟁, #한국전쟁, #포로수용소, #역사속이유\n\n1952년 5월 7일, 거제도 76수용동 문 앞에서 포로수용소장 도드 준장이 포로들에게 끌려 들어갔습니다. 포로 약 15만 명을 가둔 미군이 왜 소장을 빼앗겼고 왜 힘으로 되찾지 않았는지, 미 육군 공간사와 미국 외교문서를 따라 날짜순으로 정리합니다.\n\n📌 이 영상에서 다루는 내용\n· 포로 15만 명, 경비 9천 명의 섬\n· 철조망 안으로 들어가지 않게 된 이유\n· 판문점의 「7만」과 76수용동의 문\n· 78시간의 억류와 콜슨의 서한\n· 6월 10일, 두 시간 반의 진압\n\n⏱ 타임스탬프\n00:00 5월 7일 오후, 76수용동 문 앞\n01:06 1951년 1월, 섬 하나에 30만 명\n02:46 철조망 안의 조직\n03:26 2월 18일, 62수용동\n04:31 판문점에서 가장 막힌 문제\n05:01 4월 19일, 「약 7만 명」\n06:01 섬의 첫 번째 일, 숫자 맞추기\n06:22 이유는 세 가지\n07:08 하루 전에 온 면담 요청\n07:48 다시 5월 7일, 문이 열리다\n08:32 위에서 내려온 두 명령\n09:30 문을 부수지 않은 이유\n09:59 네 가지 요구와 세 번째 서한\n10:38 서한이 간 곳, 판문점과 워싱턴\n11:28 두 장군의 강등\n11:57 6월 10일, 2시간 30분\n12:57 수용동 하나에 500명\n13:22 세 가지 이유, 다시\n\n🔗 주요 출처\n\n미 육군 군사사센터 — Walter G. Hermes, Truce Tent and Fighting Front, 11장 「Koje-do」\nhttps://www.koreanwaronline.com/history/TruceTent/ch11.htm\n\n미 육군 군사사센터 — Walter G. Hermes, Truce Tent and Fighting Front, 8장 (1952년 4월 심사와 판문점 통보)\nhttps://www.koreanwaronline.com/history/TruceTent/ch8.htm\n\n미 국무부 외교문서(FRUS) — 존슨 차관보 메모 (1952년 5월 22일)\nhttps://history.state.gov/historicaldocuments/frus1952-54v15p1/d131\n\nAllan R. Millett — War Behind the Wire: Koje-do Prison Camp (HistoryNet)\nhttps://historynet.com/war-behind-the-wire-koje-do-prison-camp/\n\n이 외 미국 외교문서·당시 신문·연구 자료 10여 건을 참고해 사실 확인을 거쳤습니다.\n\n📷 사진 출처: Wikimedia Commons (일부 잘라내고 크기 조정, 설명 문구 추가)\n- \"1951년 거제도 포로수용소 1~3\" / 한국저작권위원회 / CC BY 4.0\n- \"Geoje-POW Camp1\" / Kang Byeong Kee / CC BY 3.0\n- 그 밖의 사진: 미국 육군·해군·공군·국립문서기록관리청(NARA), 호주 전쟁기념관(Doug Bushby), 《인민화보》 / 퍼블릭 도메인\n\n[이미지 출처]\n· 프랜시스 도드 사진(1946): 미 육군 / Public Domain (배경 제거 후 합성)\n  - Wikimedia Commons, \"Francis T. Dodd - 1946.jpg\"\n· 거제도 지도: 미 육군 지도국(Army Map Service), Korea 1:250,000 \"Koje\" 도엽(1946) / Public Domain (흑백 가공, 조준경·표시 추가)\n  - Wikimedia Commons, \"Map by the US Army Map Service - Koje - korea 250k - txu-pclmaps-oclc-6612171-koje-i-52-i.jpg\"\n· 거제도 포로수용소 사진(1952): Werner Bischof, 프랑스 국립도서관(BnF) 소장 / Public Domain (흑백 가공)\n  - Wikimedia Commons, \"Guerre de Corée - Werner Bischof, photogr. - btv1b2400165h (07 of 14).jpg\", \"(10 of 14)\", \"(12 of 14)\"", "tags": "#거제포로수용소, #거제도포로수용소, #625전쟁, #한국전쟁, #도드준장, #포로수용소장납치, #76수용동, #휴전협상, #판문점, #포로송환, #자원송환, #이학구, #콜슨, #역사속이유", "pin": "지킬 사람이 모자랐고, 철조망 안에는 들어가지 않기로 했고, 판문점에 낼 포로 숫자는 맞춰야 했습니다. 이 납치를 막으려면, 세 가지 가운데 무엇이 가장 먼저 달라져야 했을까요? 여러분의 생각을 댓글로 적어 주세요."}, "titles": [{"t": "포로 15만을 가둔 미군은.. 왜 수용소장을 납치당했을까?｜거제 포로수용소", "note": "대본 첫 장면(5월 7일 문 앞)과 바로 이어지고, 41자 · 「?」까지 32자라 모바일 목록에서 안 잘립니다."}, {"t": "포로 15만을 가둔 미군은.. 왜 수용소 문을 못 열었을까?｜거제 포로수용소", "note": "48시간 CTR이 낮아 제목을 바꿀 때 — 「힘으로 되찾지 않았다」 쪽 역설을 앞에 세우는 버전입니다."}, {"t": "전차까지 불렀는데.. 미군은 왜 사흘을 기다렸을까?｜거제 포로수용소", "note": "숫자 대신 「전차·사흘」 대비를 세게 걸고 싶을 때."}], "thumbs": ["포로 15만을 가뒀는데 / 소장을 빼앗긴 이유", "경비는 9천 명뿐인데 / 문을 연 이유", "판문점의 숫자 하나가 / 섬의 문을 연 이유"], "prompts": [{"label": "1번(추천) — 훅 장면: 거제도 수용동 격자 중 빨간 한 칸(76수용동)", "p": "Dark desaturated topographic military map of Geoje Island, South Korea, seen from directly above, with embossed mountain shading and a jagged coastline. In a valley near the island's northern shore, a dense grid of small rectangular barbed-wire prison compounds is laid out like a chessboard, drawn in thin grey lines. Exactly one compound in the grid is filled with deep red (#C62828), standing out sharply from dozens of grey ones. Monochrome grey and ink black palette, aged paper texture, soft vignette, the island fills the upper two thirds of the frame."}, {"label": "2번 — 수용동 격자 근접, 이중 철조망 문이 보이는 빨간 칸", "p": "Close top-down archival-style map detail of a Korean War prisoner-of-war camp on Geoje Island: rows of identical rectangular compounds separated by double barbed-wire fences and narrow roads, rendered in faded grey ink on aged map paper. One compound in the center is tinted deep red (#C62828), and its double gate on the road side is subtly emphasized. Desaturated monochrome with a single red accent, dramatic contrast, upper half dense with detail."}, {"label": "3번 — 판문점에서 거제도까지 이어지는 점선 하나", "p": "Dark desaturated topographic military map of the southern Korean Peninsula, embossed terrain relief, ink black seas and grey mountains on yellowed paper texture. A single thin dashed line runs from Panmunjom near the 38th parallel down the length of the peninsula to Geoje Island off the southeast coast. The end point on Geoje Island is marked with one small deep red (#C62828) dot. Tense, ominous mood, the line and island in the upper two thirds of the frame."}, {"label": "4번 — 위성 사진 톤의 거제도, 북쪽 골짜기에 빨간 점 하나", "p": "Satellite-photo-toned monochrome relief map of Geoje Island and the surrounding southeastern Korean coast at night, deep shadows and dramatic contrast, no city lights. The island is large in the upper frame, its rugged mountains and inlets clearly visible. A single small deep red (#C62828) point glows in a valley on the northern shore. Moody, desaturated, cinematic atmosphere."}, {"label": "5번 — 자유안: 조금 열린 철조망 이중문(인물 없음, 흑백 기록사진풍)", "p": "Black-and-white archival photograph style image of a double barbed-wire gate of a 1950s Korean War prisoner camp, seen head-on at ground level, wooden posts and tangled wire, the outer gate slightly ajar. Empty dirt road in front, rows of canvas tents blurred behind the fence. High-contrast grayscale with a faint deep red tint on the open gate only, no people, tense quiet mood, the gate fills the upper two thirds of the frame."}], "script": "1952년 5월 7일 오후 두 시 무렵, 거제도. 76수용동 철조망 문 앞에서 미군 준장 한 명이 포로 대표와 이야기를 나누고 있습니다. 거제도 포로수용소 전체를 맡은 소장, 프랜시스 도드였죠. 작업반이 지나가느라 바깥 문이 열린 순간, 포로들이 달려들어 소장을 철조망 안으로 끌고 들어갔습니다.\n\n그런데 이상한 점이 있습니다. 그때 이 섬에 갇혀 있던 포로는 약 15만 명이었어요. 그 포로를 지키는 쪽의 책임자가 거꾸로 붙잡힌 겁니다.\n\n더 이상한 건 그다음입니다. 사흘 사이 섬에는 1만 1천 명이 넘는 무장 병력과 전차까지 모였는데, 미군은 끝내 문을 부수지 않았어요. 대신 유엔군이 많은 포로를 죽이고 다치게 했다는 문장이 든 서한에 서명하고 나서야 소장을 돌려받았습니다.\n\n15만 명을 가두고 병력과 전차까지 있었는데, 미군은 왜 수용소장을 빼앗겼고, 왜 힘으로 되찾지 않았을까요?\n\n오늘은 그 이유를 알아보겠습니다. 이야기는 1951년 1월, 거제도에 첫 포로들이 내리던 때에서 시작됩니다.\n\n1951년 1월, 거제도. 부산에서 남서쪽으로 바다를 건너면 나오는 섬입니다. 수용소가 들어선 곳은 지금의 거제시 고현동 일대예요.\n\n미군이 이 섬에 포로수용소를 세우기로 하면서 잡은 섬 인구가 있어요. 원래 살던 주민이 12만 명 가까이, 전쟁을 피해 건너온 피란민이 10만 명이었죠.\n\n여기에 포로 15만 명을 더 들이는 계획이었습니다. 섬 하나에 30만 명이 넘게 모이고, 원래 주민보다 포로가 더 많아지는 거예요.\n\n포로들을 가둔 곳은 수용동이라고 불렀어요. 철조망으로 둘러친 포로 막사 한 구역을 말해요. 섬 북쪽 해안의 두 골짜기에 네 구역을 만들고, 구역마다 여덟 개씩 모두 서른두 개를 지었습니다.\n\n먼저 정원입니다. 수용동 하나는 천 명 안팎이 지내도록 지었습니다.\n\n다음은 실제로 들어간 인원이에요. 얼마 안 가 정원의 다섯 배가 들어찼고, 한 수용동에 5천에서 6천 명이 지내게 됐죠.\n\n마지막은 지키는 사람입니다. 그해 연말 이 섬의 미군과 국군은 9천 명 남짓이었어요. 요청한 인원보다 6천 명가량 모자랐죠.\n\n경비 한 명이 포로 열여섯, 열일곱 명을 맡는 셈이에요. 지원 인원까지 넣은 계산이라, 철조망 앞에 선 사람 한 명이 맡은 포로는 이보다 많았습니다.\n\n지휘하는 사람도 자주 바뀌었어요. 그해 아홉 달 동안 수용소 지휘관이 여덟 명 거쳐 갔어요. 한 달에 한 명꼴이었습니다.\n\n그사이 철조망 안은 포로들이 장악해 가고 있었어요. 실제로 움직이는 사람은 따로 있었고, 겉으로는 명목상 지휘자를 앞세웠죠. 나중에는 자기들이 먹을 식량과 보급품을 들여오는 것조차 거부하는 수용동까지 나옵니다.\n\n그 철조망 안에서는 미군이 모르는 조직이 움직이고 있었습니다.\n\n그 조직은 저절로 생긴 게 아니었어요. 북한군 공작원 가운데 일부가 일부러 포로로 잡혀 수용소에 들어왔거든요.\n\n미 육군 공간사에는 이 공작원 조직의 위쪽에 판문점 휴전 협상의 북한 대표 남일과 이상조가 있었다고 적혀 있습니다. 섬 안의 수용동과 판문점을 잇는 계통이 있었던 거죠.\n\n철조망 안에서는 포로끼리 부딪치는 일이 잦았어요. 공산주의를 따르는 포로와 반대하는 포로가 맞섰고, 포로들끼리 인민재판을 열어 서로를 처벌하기도 했죠.\n\n그해 말에는 62수용동에서 두 편이 맞붙어 14명이 숨졌죠.\n\n1952년 2월 18일, 62수용동. 이곳에는 포로가 아니라 민간인 억류자들이 있었어요. 이날 미군 병력이 수용동 안으로 들어갔습니다. 심사를 하기 위해서였어요. 심사는 포로 한 명 한 명에게 고향으로 돌아갈지, 남을지를 묻는 일이에요.\n\n억류자들은 심사를 거부하며 맞섰어요. 충돌 끝에 억류자 70명 넘게 숨졌고, 미군도 한 명이 숨졌습니다.\n\n사망자 수는 기록마다 다릅니다. 미 육군 공간사는 77명, 연구자 밀렛은 75명으로 적었어요.\n\n이틀 뒤, 프랜시스 도드 준장이 거제도 포로수용소 소장으로 왔습니다. 준장은 별 하나 장군이에요.\n\n그 뒤로 미군이 수용동 안에 들어가는 일은 점점 어려워졌어요. 밤에는 아예 수용동에 들어가지 않았고, 몇 주가 지나자 많은 수용동은 낮에도 들어갈 수 없게 됐죠.\n\n도드가 맡은 수용소는 바깥은 미군이 지키고, 안은 포로 지도자들이 움직이는 곳이었습니다.\n\n그런데 들어가지 않는 수용소에서도 꼭 해야 하는 일이 하나 있었습니다. 숫자를 세는 일이었습니다.\n\n그 무렵 판문점 휴전 협상에서 가장 크게 막힌 문제는 포로를 어떻게 돌려보내느냐였어요. 그해 초 유엔군 대표 리비 제독은 포로 한 사람 한 사람이 돌아갈지 말지를 스스로 고르게 하자고 내놓았죠.\n\n돌아가기 싫은 포로는 억지로 보내지 않는다는 원칙, 자원송환입니다. 공산측은 이튿날 이 제안을 터무니없다고 했어요.\n\n이 원칙대로 하려면 포로마다 뜻을 물어야 했어요. 거제도의 심사는 4월 초에 시작됐습니다.\n\n4월 19일, 판문점. 유엔군은 송환을 원하는 포로가 약 7만 명이라고 알렸습니다. 공산측은 약 11만 6천 명을 기대하고 있었어요. 유엔군이 앞서 그 정도가 될 수 있다고 말했거든요.\n\n공산측 대표는 그 자리에서 휴회를 요청했어요. 이튿날에는 이 숫자를 검토하는 것조차 완전히 불가능하다고 답했죠.\n\n그런데 이 7만 안에는 따로 볼 부분이 있었어요. 심사를 거부한 수용동의 북한군 포로 3만 7천여 명이 들어 있었어요.\n\n심사를 거부한 수용동이 일곱 곳 나오자, 그달 말 유엔군 사령관 리지웨이는 큰 무력 없이는 수용동 안을 제대로 통제할 수 없다고 보고했어요. 그리고 그 수용동들은 억지로 심사하지 않게 해 달라고 요청했고, 워싱턴은 같은 날 이를 승인했습니다.\n\n심사를 거부한 그 포로들에게는 아무도 뜻을 묻지 못했어요. 묻지 않은 채 돌아가겠다는 쪽으로 셌습니다. 판문점에 내놓은 숫자의 큰 부분이, 미군이 들어가지 못한 수용동에서 나온 거예요.\n\n그러니 판문점에서 이 숫자를 지키려면 거제도에서 포로 명단을 만들고 신원을 확인해야 했어요. 이때부터 섬에서 가장 먼저 할 일은 포로 숫자를 정확히 맞추는 일이 됐습니다.\n\n그 일 때문에, 열흘도 안 돼 수용소장이 76수용동 문 앞에 서게 됩니다. 소장이 붙잡힌 이유는 여기까지 나온 조건 안에 다 들어 있습니다.\n\n이유는 크게 세 가지입니다.\n\n첫째, 사람이 모자랐어요. 포로 약 15만 명을 지키는 사람이 9천 명 남짓이었죠. 수용동 하나하나도 처음 지은 정원보다 훨씬 많은 포로를 안고 있었어요.\n\n둘째, 철조망 안으로 들어가지 않기로 했습니다. 2월의 충돌을 겪고 봄에는 심사까지 거부당하자, 미군은 큰 무력 없이는 안을 통제할 수 없다고 판단했어요.\n\n셋째, 판문점의 숫자가 가장 급했어요. 7만이라는 숫자를 확정하려면 포로 명단과 신원 확인이 있어야 했죠. 그런데 안으로 들어갈 수 없으니, 소장이 문 앞에서 포로 대표와 직접 이야기해야 했습니다.\n\n도드는 이 무렵 남은 포로 전원의 정확한 명단을 만들고 신원을 확인하라는 지시를 막 받은 참이었어요.\n\n소장이 76수용동 문 앞에 서기 하루 전, 그 수용동 포로들이 헌병대의 레이븐 중령에게 소장을 만나고 싶다고 전했어요. 중요한 문제를 이야기하고 싶다는 거였죠. 포로들은 소장이 직접 와서 이야기하면 명단을 만들고 지문을 찍게 해 주겠다고 했습니다.\n\n세 이유가 겹친 곳이 그 수용동의 출입구였어요. 이 출입구는 문이 두 겹이었고, 작업반이 늘 드나들어 수용동 문에는 자물쇠가 없었죠. 도드는 평소에도 무장 없이 수용동 문 앞에 가서 포로 지도자들과 이야기하곤 했습니다.\n\n이 세 이유는 그 뒤 사흘 넘게 이어진 일에서 한꺼번에 드러납니다. 다시 5월 7일 오후입니다.\n\n도드가 문 앞에 닿은 건 레이븐 중령이 수용동 대표들과 이야기를 마치고 몇 분 뒤였어요. 두 사람은 평소처럼 잠기지 않은 문을 사이에 두고 포로 대표들과 마주 섰습니다.\n\n앞서 본 대로 작업반을 내보내려고 바깥 문을 연 순간, 포로들이 달려들었어요. 레이븐 중령은 문기둥을 붙잡고 버텨 밖에 남았고, 도드만 안으로 끌려 들어갔죠.\n\n얼마 뒤 수용동 안에 영어로 쓴 표지판이 걸렸어요. 뜻은 이렇습니다. 우리가 도드를 잡았다. 우리 요구가 풀리는 동안 그의 안전은 보장한다.\n\n이 납치가 어디서 나왔는지도 기록을 봐야 해요. 수용소 안과 판문점을 잇는 지휘 계통은 있었습니다. 다만 이 납치를 평양이 직접 지시했는지는 기록마다 다릅니다.\n\n이튿날, 군단 참모장 콜슨 준장이 보병 한 개 대대와 함께 섬에 왔습니다. 이제 이 일을 지휘하는 사람은 콜슨이었어요.\n\n위에서 내려온 말은 둘이었어요. 미8군 사령관 밴플리트는 자기 승인 없이는 무력을 쓰지 말라고 했어요. 기자와 사진 촬영을 막고, 포로들의 요구를 글로 받아 시한을 정한 뒤에 필요하면 들어가라는 명령이었죠. 유엔군 사령관 리지웨이는 도드를 구하는 데 필요한 만큼 무력을 쓰라고 했습니다.\n\n그다음 날, 수용동 안에서 포로들이 인민재판을 열었습니다. 이번에 앞에 앉은 사람은 도드였어요. 포로들은 그동안 수용소에서 포로가 죽거나 다친 일 열아홉 건을 하나씩 꺼내 따졌죠.\n\n그날 밤부터 이튿날 사이 섬에는 전차가 들어왔어요. 전차 수는 기록마다 다릅니다. 미 육군 공간사는 20대, 밀렛은 22대로 적었어요.\n\n무장 병력도 1만 1천 명 넘게 모였어요. 무력은 있었습니다. 쓰지 못했을 뿐입니다.\n\n문을 부수고 들어가면 도드를 포함해 양쪽에서 사상자가 많이 날 수 있었어요. 공간사는 콜슨이 이 때문에 힘으로 들어가지 않았다고 적었습니다. 2월에도 사상자가 나오자, 그 일은 판문점에서 공산측이 유엔군을 비난하는 데 쓰였죠. 2월 사건 닷새 뒤 남일은 판문점에서 그 일을 야만적 학살이라고 비난했거든요.\n\n시한은 5월 10일 오전 열 시였습니다. 콜슨은 이 시한을 미뤘고, 그날 아침 협상으로 풀기로 정했어요.\n\n포로들의 요구는 네 가지였어요. 포로 학대를 멈출 것, 북한군과 중국군 포로의 자원송환을 멈출 것, 강제 심사를 멈출 것, 포로 대표단을 인정할 것이었죠.\n\n콜슨은 답신을 세 번째 안까지 고쳐 썼습니다. 그 안에는 이런 문장이 들어갔어요. 유엔군이 많은 포로를 죽이고 다치게 한 유혈 사태가 있었음을 인정한다. 강제 심사를 하지 않고 포로 대표단을 승인하겠다는 약속도 함께 담겼죠.\n\n서명한 사람은 도드가 아니라 콜슨이었습니다. 그날 밤 서명이 끝났고, 밤 아홉 시 반, 도드는 풀려났어요.\n\n도드가 붙잡혀 있던 시간은 약 78시간, 사흘이 넘었습니다.\n\n장군은 돌아왔습니다. 그런데 콜슨의 서한은 곧 판문점과 워싱턴으로 넘어갔습니다.\n\n판문점의 공산측 대표들은 이 서한을 유엔군의 자백으로 내세웠어요. 미 국무부 기록에는 공산측이 이 일로 선전에서 아주 큰 이득을 봤다고 적혀 있습니다.\n\n이틀 뒤 새 유엔군 사령관이 된 클라크는 도쿄에서 성명을 냈어요. 포로들의 요구는 순전한 협박이었고, 콜슨의 약속은 강박 속에서 한 것이라고 했죠.\n\n이튿날 거제도 수용동에는 확성기 방송이 나갔어요. 여러분의 뜻을 알아보는 심사는 없을 것이라는 내용이었습니다.\n\n5월 22일, 국무부의 존슨 차관보는 메모를 남겼어요. 이 사건 때문에 심사 결과 자체가 타당성을 잃을 수 있다는 내용이었죠. 판문점에 내놓은 7만이라는 숫자까지 의심받을 수 있다는 뜻이었습니다.\n\n두 장군에 대한 처분도 이어졌어요. 8군 조사위원회는 도드와 콜슨에게 잘못이 없다고 봤습니다. 그러나 클라크의 건의로 5월 하순 두 사람은 모두 대령으로 강등됐어요. 군법회의가 아니라 행정 조치였습니다.\n\n리지웨이는 이 일을 두고, 피 흘린 전투에서 당할 수 있는 어떤 패배만큼이나 굴욕적이고 해로운 패배라고 했어요.\n\n섬에서는 사흘 남짓 벌어진 일이었지만, 판문점과 워싱턴에서는 그달 내내 이 일을 다뤘습니다.\n\n그리고 한 달 뒤, 미군은 다시 76수용동 문 앞에 섭니다.\n\n5월 중순 새 소장으로 보트너 준장이 왔어요. 밴플리트가 임명한 사람이었죠. 보트너가 온 뒤 섬의 민간인 6천 명 넘게 섬 밖으로 옮겨졌습니다.\n\n6월 10일, 76수용동. 이 수용동에는 북한군 장교와 부사관 약 6,500명이 있었어요. 이번에는 미군이 문 앞에서 기다리지 않았습니다. 미군 낙하산 부대 병력이 전차와 함께 안으로 들어갔죠.\n\n진압은 약 2시간 30분 만에 끝났어요.\n\n포로 31명이 숨졌고, 미군도 한 명이 숨졌습니다. 밀렛이 전한 미군 조사로는 숨진 포로의 약 절반은 동료 포로에게 살해됐어요.\n\n수용동 안에서는 창 3천 자루와 휘발유를 채운 수류탄 1천 개가 나왔습니다. 수용동 대변인이던 이학구도 이때 끌려 나왔어요. 북한군 13사단 참모장 출신이었죠.\n\n한 달 전에는 사흘 넘게 기다린 문 앞에서, 이번에는 두 시간 반 만에 일이 끝난 겁니다.\n\n그 뒤 두 주 동안 다른 여섯 개 수용동의 포로들은 저항 없이 새 수용동으로 옮겨 갔어요. 밴플리트가 5월 중순에 내놓은 새 계획대로였죠.\n\n새 계획에서 수용동 하나에 들어가는 포로는 500명이었습니다. 이런 수용동을 묶어 4천 명 단위 구역을 만들고, 구역끼리는 멀찍이 떨어뜨려 두는 계획이었죠.\n\n포로를 한곳에 크게 모아 두던 방식이 이렇게 바뀌었습니다.\n\n5월 7일 오후, 포로 15만 명을 가둔 쪽이 소장을 빼앗긴 이유는 세 가지였습니다.\n\n첫째, 포로에 비해 지키는 사람이 너무 적었어요. 둘째, 수용동 안의 충돌과 심사 거부를 겪고, 미군은 철조망 안에 들어가지 않기로 했어요. 셋째, 그런데도 판문점에 낼 포로 숫자는 맞춰야 해서, 소장이 직접 문 앞까지 가야 했죠.\n\n이 납치는 장군 한 사람이 방심해서 생긴 일이 아니었습니다. 이 세 가지는 각각 다른 때 생겼지만, 5월 7일 오후 76수용동 문 앞에서 한꺼번에 겹쳤습니다.\n\n그 문 앞에서 미군은 사흘 넘게 기다리기만 했어요. 한 달 뒤에는 직접 안으로 들어가, 두 시간 반 만에 수용동을 되찾았습니다. 그리고 수천 명씩 모아 두던 수용동을 500명씩으로 잘게 나눴어요. 포로를 한곳에 크게 모아 두는 방식은 그렇게 끝났습니다.\n\n오늘은 포로 15만을 가둔 미군이 왜 수용소장을 빼앗겼는지 알아봤습니다. 이 납치를 막으려면, 세 가지 가운데 무엇이 가장 먼저 달라져야 했을까요? 여러분의 생각을 댓글로 적어 주세요.\n\n지금까지 역사 속 이유였습니다.", "paras": ["1952년 5월 7일 오후 두 시 무렵, 거제도. 76수용동 철조망 문 앞에서 미군 준장 한 명이 포로 대표와 이야기를 나누고 있습니다. 거제도 포로수용소 전체를 맡은 소장, 프랜시스 도드였죠. 작업반이 지나가느라 바깥 문이 열린 순간, 포로들이 달려들어 소장을 철조망 안으로 끌고 들어갔습니다.", "그런데 이상한 점이 있습니다. 그때 이 섬에 갇혀 있던 포로는 약 15만 명이었어요. 그 포로를 지키는 쪽의 책임자가 거꾸로 붙잡힌 겁니다.", "더 이상한 건 그다음입니다. 사흘 사이 섬에는 1만 1천 명이 넘는 무장 병력과 전차까지 모였는데, 미군은 끝내 문을 부수지 않았어요. 대신 유엔군이 많은 포로를 죽이고 다치게 했다는 문장이 든 서한에 서명하고 나서야 소장을 돌려받았습니다.", "15만 명을 가두고 병력과 전차까지 있었는데, 미군은 왜 수용소장을 빼앗겼고, 왜 힘으로 되찾지 않았을까요?", "오늘은 그 이유를 알아보겠습니다. 이야기는 1951년 1월, 거제도에 첫 포로들이 내리던 때에서 시작됩니다.", "1951년 1월, 거제도. 부산에서 남서쪽으로 바다를 건너면 나오는 섬입니다. 수용소가 들어선 곳은 지금의 거제시 고현동 일대예요.", "미군이 이 섬에 포로수용소를 세우기로 하면서 잡은 섬 인구가 있어요. 원래 살던 주민이 12만 명 가까이, 전쟁을 피해 건너온 피란민이 10만 명이었죠.", "여기에 포로 15만 명을 더 들이는 계획이었습니다. 섬 하나에 30만 명이 넘게 모이고, 원래 주민보다 포로가 더 많아지는 거예요.", "포로들을 가둔 곳은 수용동이라고 불렀어요. 철조망으로 둘러친 포로 막사 한 구역을 말해요. 섬 북쪽 해안의 두 골짜기에 네 구역을 만들고, 구역마다 여덟 개씩 모두 서른두 개를 지었습니다.", "먼저 정원입니다. 수용동 하나는 천 명 안팎이 지내도록 지었습니다.", "다음은 실제로 들어간 인원이에요. 얼마 안 가 정원의 다섯 배가 들어찼고, 한 수용동에 5천에서 6천 명이 지내게 됐죠.", "마지막은 지키는 사람입니다. 그해 연말 이 섬의 미군과 국군은 9천 명 남짓이었어요. 요청한 인원보다 6천 명가량 모자랐죠.", "경비 한 명이 포로 열여섯, 열일곱 명을 맡는 셈이에요. 지원 인원까지 넣은 계산이라, 철조망 앞에 선 사람 한 명이 맡은 포로는 이보다 많았습니다.", "지휘하는 사람도 자주 바뀌었어요. 그해 아홉 달 동안 수용소 지휘관이 여덟 명 거쳐 갔어요. 한 달에 한 명꼴이었습니다.", "그사이 철조망 안은 포로들이 장악해 가고 있었어요. 실제로 움직이는 사람은 따로 있었고, 겉으로는 명목상 지휘자를 앞세웠죠. 나중에는 자기들이 먹을 식량과 보급품을 들여오는 것조차 거부하는 수용동까지 나옵니다.", "그 철조망 안에서는 미군이 모르는 조직이 움직이고 있었습니다.", "그 조직은 저절로 생긴 게 아니었어요. 북한군 공작원 가운데 일부가 일부러 포로로 잡혀 수용소에 들어왔거든요.", "미 육군 공간사에는 이 공작원 조직의 위쪽에 판문점 휴전 협상의 북한 대표 남일과 이상조가 있었다고 적혀 있습니다. 섬 안의 수용동과 판문점을 잇는 계통이 있었던 거죠.", "철조망 안에서는 포로끼리 부딪치는 일이 잦았어요. 공산주의를 따르는 포로와 반대하는 포로가 맞섰고, 포로들끼리 인민재판을 열어 서로를 처벌하기도 했죠.", "그해 말에는 62수용동에서 두 편이 맞붙어 14명이 숨졌죠.", "1952년 2월 18일, 62수용동. 이곳에는 포로가 아니라 민간인 억류자들이 있었어요. 이날 미군 병력이 수용동 안으로 들어갔습니다. 심사를 하기 위해서였어요. 심사는 포로 한 명 한 명에게 고향으로 돌아갈지, 남을지를 묻는 일이에요.", "억류자들은 심사를 거부하며 맞섰어요. 충돌 끝에 억류자 70명 넘게 숨졌고, 미군도 한 명이 숨졌습니다.", "사망자 수는 기록마다 다릅니다. 미 육군 공간사는 77명, 연구자 밀렛은 75명으로 적었어요.", "이틀 뒤, 프랜시스 도드 준장이 거제도 포로수용소 소장으로 왔습니다. 준장은 별 하나 장군이에요.", "그 뒤로 미군이 수용동 안에 들어가는 일은 점점 어려워졌어요. 밤에는 아예 수용동에 들어가지 않았고, 몇 주가 지나자 많은 수용동은 낮에도 들어갈 수 없게 됐죠.", "도드가 맡은 수용소는 바깥은 미군이 지키고, 안은 포로 지도자들이 움직이는 곳이었습니다.", "그런데 들어가지 않는 수용소에서도 꼭 해야 하는 일이 하나 있었습니다. 숫자를 세는 일이었습니다.", "그 무렵 판문점 휴전 협상에서 가장 크게 막힌 문제는 포로를 어떻게 돌려보내느냐였어요. 그해 초 유엔군 대표 리비 제독은 포로 한 사람 한 사람이 돌아갈지 말지를 스스로 고르게 하자고 내놓았죠.", "돌아가기 싫은 포로는 억지로 보내지 않는다는 원칙, 자원송환입니다. 공산측은 이튿날 이 제안을 터무니없다고 했어요.", "이 원칙대로 하려면 포로마다 뜻을 물어야 했어요. 거제도의 심사는 4월 초에 시작됐습니다.", "4월 19일, 판문점. 유엔군은 송환을 원하는 포로가 약 7만 명이라고 알렸습니다. 공산측은 약 11만 6천 명을 기대하고 있었어요. 유엔군이 앞서 그 정도가 될 수 있다고 말했거든요.", "공산측 대표는 그 자리에서 휴회를 요청했어요. 이튿날에는 이 숫자를 검토하는 것조차 완전히 불가능하다고 답했죠.", "그런데 이 7만 안에는 따로 볼 부분이 있었어요. 심사를 거부한 수용동의 북한군 포로 3만 7천여 명이 들어 있었어요.", "심사를 거부한 수용동이 일곱 곳 나오자, 그달 말 유엔군 사령관 리지웨이는 큰 무력 없이는 수용동 안을 제대로 통제할 수 없다고 보고했어요. 그리고 그 수용동들은 억지로 심사하지 않게 해 달라고 요청했고, 워싱턴은 같은 날 이를 승인했습니다.", "심사를 거부한 그 포로들에게는 아무도 뜻을 묻지 못했어요. 묻지 않은 채 돌아가겠다는 쪽으로 셌습니다. 판문점에 내놓은 숫자의 큰 부분이, 미군이 들어가지 못한 수용동에서 나온 거예요.", "그러니 판문점에서 이 숫자를 지키려면 거제도에서 포로 명단을 만들고 신원을 확인해야 했어요. 이때부터 섬에서 가장 먼저 할 일은 포로 숫자를 정확히 맞추는 일이 됐습니다.", "그 일 때문에, 열흘도 안 돼 수용소장이 76수용동 문 앞에 서게 됩니다. 소장이 붙잡힌 이유는 여기까지 나온 조건 안에 다 들어 있습니다.", "이유는 크게 세 가지입니다.", "첫째, 사람이 모자랐어요. 포로 약 15만 명을 지키는 사람이 9천 명 남짓이었죠. 수용동 하나하나도 처음 지은 정원보다 훨씬 많은 포로를 안고 있었어요.", "둘째, 철조망 안으로 들어가지 않기로 했습니다. 2월의 충돌을 겪고 봄에는 심사까지 거부당하자, 미군은 큰 무력 없이는 안을 통제할 수 없다고 판단했어요.", "셋째, 판문점의 숫자가 가장 급했어요. 7만이라는 숫자를 확정하려면 포로 명단과 신원 확인이 있어야 했죠. 그런데 안으로 들어갈 수 없으니, 소장이 문 앞에서 포로 대표와 직접 이야기해야 했습니다.", "도드는 이 무렵 남은 포로 전원의 정확한 명단을 만들고 신원을 확인하라는 지시를 막 받은 참이었어요.", "소장이 76수용동 문 앞에 서기 하루 전, 그 수용동 포로들이 헌병대의 레이븐 중령에게 소장을 만나고 싶다고 전했어요. 중요한 문제를 이야기하고 싶다는 거였죠. 포로들은 소장이 직접 와서 이야기하면 명단을 만들고 지문을 찍게 해 주겠다고 했습니다.", "세 이유가 겹친 곳이 그 수용동의 출입구였어요. 이 출입구는 문이 두 겹이었고, 작업반이 늘 드나들어 수용동 문에는 자물쇠가 없었죠. 도드는 평소에도 무장 없이 수용동 문 앞에 가서 포로 지도자들과 이야기하곤 했습니다.", "이 세 이유는 그 뒤 사흘 넘게 이어진 일에서 한꺼번에 드러납니다. 다시 5월 7일 오후입니다.", "도드가 문 앞에 닿은 건 레이븐 중령이 수용동 대표들과 이야기를 마치고 몇 분 뒤였어요. 두 사람은 평소처럼 잠기지 않은 문을 사이에 두고 포로 대표들과 마주 섰습니다.", "앞서 본 대로 작업반을 내보내려고 바깥 문을 연 순간, 포로들이 달려들었어요. 레이븐 중령은 문기둥을 붙잡고 버텨 밖에 남았고, 도드만 안으로 끌려 들어갔죠.", "얼마 뒤 수용동 안에 영어로 쓴 표지판이 걸렸어요. 뜻은 이렇습니다. 우리가 도드를 잡았다. 우리 요구가 풀리는 동안 그의 안전은 보장한다.", "이 납치가 어디서 나왔는지도 기록을 봐야 해요. 수용소 안과 판문점을 잇는 지휘 계통은 있었습니다. 다만 이 납치를 평양이 직접 지시했는지는 기록마다 다릅니다.", "이튿날, 군단 참모장 콜슨 준장이 보병 한 개 대대와 함께 섬에 왔습니다. 이제 이 일을 지휘하는 사람은 콜슨이었어요.", "위에서 내려온 말은 둘이었어요. 미8군 사령관 밴플리트는 자기 승인 없이는 무력을 쓰지 말라고 했어요. 기자와 사진 촬영을 막고, 포로들의 요구를 글로 받아 시한을 정한 뒤에 필요하면 들어가라는 명령이었죠. 유엔군 사령관 리지웨이는 도드를 구하는 데 필요한 만큼 무력을 쓰라고 했습니다.", "그다음 날, 수용동 안에서 포로들이 인민재판을 열었습니다. 이번에 앞에 앉은 사람은 도드였어요. 포로들은 그동안 수용소에서 포로가 죽거나 다친 일 열아홉 건을 하나씩 꺼내 따졌죠.", "그날 밤부터 이튿날 사이 섬에는 전차가 들어왔어요. 전차 수는 기록마다 다릅니다. 미 육군 공간사는 20대, 밀렛은 22대로 적었어요.", "무장 병력도 1만 1천 명 넘게 모였어요. 무력은 있었습니다. 쓰지 못했을 뿐입니다.", "문을 부수고 들어가면 도드를 포함해 양쪽에서 사상자가 많이 날 수 있었어요. 공간사는 콜슨이 이 때문에 힘으로 들어가지 않았다고 적었습니다. 2월에도 사상자가 나오자, 그 일은 판문점에서 공산측이 유엔군을 비난하는 데 쓰였죠. 2월 사건 닷새 뒤 남일은 판문점에서 그 일을 야만적 학살이라고 비난했거든요.", "시한은 5월 10일 오전 열 시였습니다. 콜슨은 이 시한을 미뤘고, 그날 아침 협상으로 풀기로 정했어요.", "포로들의 요구는 네 가지였어요. 포로 학대를 멈출 것, 북한군과 중국군 포로의 자원송환을 멈출 것, 강제 심사를 멈출 것, 포로 대표단을 인정할 것이었죠.", "콜슨은 답신을 세 번째 안까지 고쳐 썼습니다. 그 안에는 이런 문장이 들어갔어요. 유엔군이 많은 포로를 죽이고 다치게 한 유혈 사태가 있었음을 인정한다. 강제 심사를 하지 않고 포로 대표단을 승인하겠다는 약속도 함께 담겼죠.", "서명한 사람은 도드가 아니라 콜슨이었습니다. 그날 밤 서명이 끝났고, 밤 아홉 시 반, 도드는 풀려났어요.", "도드가 붙잡혀 있던 시간은 약 78시간, 사흘이 넘었습니다.", "장군은 돌아왔습니다. 그런데 콜슨의 서한은 곧 판문점과 워싱턴으로 넘어갔습니다.", "판문점의 공산측 대표들은 이 서한을 유엔군의 자백으로 내세웠어요. 미 국무부 기록에는 공산측이 이 일로 선전에서 아주 큰 이득을 봤다고 적혀 있습니다.", "이틀 뒤 새 유엔군 사령관이 된 클라크는 도쿄에서 성명을 냈어요. 포로들의 요구는 순전한 협박이었고, 콜슨의 약속은 강박 속에서 한 것이라고 했죠.", "이튿날 거제도 수용동에는 확성기 방송이 나갔어요. 여러분의 뜻을 알아보는 심사는 없을 것이라는 내용이었습니다.", "5월 22일, 국무부의 존슨 차관보는 메모를 남겼어요. 이 사건 때문에 심사 결과 자체가 타당성을 잃을 수 있다는 내용이었죠. 판문점에 내놓은 7만이라는 숫자까지 의심받을 수 있다는 뜻이었습니다.", "두 장군에 대한 처분도 이어졌어요. 8군 조사위원회는 도드와 콜슨에게 잘못이 없다고 봤습니다. 그러나 클라크의 건의로 5월 하순 두 사람은 모두 대령으로 강등됐어요. 군법회의가 아니라 행정 조치였습니다.", "리지웨이는 이 일을 두고, 피 흘린 전투에서 당할 수 있는 어떤 패배만큼이나 굴욕적이고 해로운 패배라고 했어요.", "섬에서는 사흘 남짓 벌어진 일이었지만, 판문점과 워싱턴에서는 그달 내내 이 일을 다뤘습니다.", "그리고 한 달 뒤, 미군은 다시 76수용동 문 앞에 섭니다.", "5월 중순 새 소장으로 보트너 준장이 왔어요. 밴플리트가 임명한 사람이었죠. 보트너가 온 뒤 섬의 민간인 6천 명 넘게 섬 밖으로 옮겨졌습니다.", "6월 10일, 76수용동. 이 수용동에는 북한군 장교와 부사관 약 6,500명이 있었어요. 이번에는 미군이 문 앞에서 기다리지 않았습니다. 미군 낙하산 부대 병력이 전차와 함께 안으로 들어갔죠.", "진압은 약 2시간 30분 만에 끝났어요.", "포로 31명이 숨졌고, 미군도 한 명이 숨졌습니다. 밀렛이 전한 미군 조사로는 숨진 포로의 약 절반은 동료 포로에게 살해됐어요.", "수용동 안에서는 창 3천 자루와 휘발유를 채운 수류탄 1천 개가 나왔습니다. 수용동 대변인이던 이학구도 이때 끌려 나왔어요. 북한군 13사단 참모장 출신이었죠.", "한 달 전에는 사흘 넘게 기다린 문 앞에서, 이번에는 두 시간 반 만에 일이 끝난 겁니다.", "그 뒤 두 주 동안 다른 여섯 개 수용동의 포로들은 저항 없이 새 수용동으로 옮겨 갔어요. 밴플리트가 5월 중순에 내놓은 새 계획대로였죠.", "새 계획에서 수용동 하나에 들어가는 포로는 500명이었습니다. 이런 수용동을 묶어 4천 명 단위 구역을 만들고, 구역끼리는 멀찍이 떨어뜨려 두는 계획이었죠.", "포로를 한곳에 크게 모아 두던 방식이 이렇게 바뀌었습니다.", "5월 7일 오후, 포로 15만 명을 가둔 쪽이 소장을 빼앗긴 이유는 세 가지였습니다.", "첫째, 포로에 비해 지키는 사람이 너무 적었어요. 둘째, 수용동 안의 충돌과 심사 거부를 겪고, 미군은 철조망 안에 들어가지 않기로 했어요. 셋째, 그런데도 판문점에 낼 포로 숫자는 맞춰야 해서, 소장이 직접 문 앞까지 가야 했죠.", "이 납치는 장군 한 사람이 방심해서 생긴 일이 아니었습니다. 이 세 가지는 각각 다른 때 생겼지만, 5월 7일 오후 76수용동 문 앞에서 한꺼번에 겹쳤습니다.", "그 문 앞에서 미군은 사흘 넘게 기다리기만 했어요. 한 달 뒤에는 직접 안으로 들어가, 두 시간 반 만에 수용동을 되찾았습니다. 그리고 수천 명씩 모아 두던 수용동을 500명씩으로 잘게 나눴어요. 포로를 한곳에 크게 모아 두는 방식은 그렇게 끝났습니다.", "오늘은 포로 15만을 가둔 미군이 왜 수용소장을 빼앗겼는지 알아봤습니다. 이 납치를 막으려면, 세 가지 가운데 무엇이 가장 먼저 달라져야 했을까요? 여러분의 생각을 댓글로 적어 주세요.", "지금까지 역사 속 이유였습니다."], "ts": "00:00 5월 7일 오후, 76수용동 문 앞\n01:06 1951년 1월, 섬 하나에 30만 명\n02:46 철조망 안의 조직\n03:26 2월 18일, 62수용동\n04:31 판문점에서 가장 막힌 문제\n05:01 4월 19일, 「약 7만 명」\n06:01 섬의 첫 번째 일, 숫자 맞추기\n06:22 이유는 세 가지\n07:08 하루 전에 온 면담 요청\n07:48 다시 5월 7일, 문이 열리다\n08:32 위에서 내려온 두 명령\n09:30 문을 부수지 않은 이유\n09:59 네 가지 요구와 세 번째 서한\n10:38 서한이 간 곳, 판문점과 워싱턴\n11:28 두 장군의 강등\n11:57 6월 10일, 2시간 30분\n12:57 수용동 하나에 500명\n13:22 세 가지 이유, 다시"};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = []; // 복사 원문
function btn(text, label){ store.push(text); return `<button class="copy" data-i="${store.length-1}" type="button">${label||'복사'}</button>`; }
function block(title, text, opts={}){
  return `<div class="block"><div class="bhead"><h2>${title}</h2>${btn(text, opts.label)}</div>
  <div class="body"><p class="pre ${opts.mono?'mono':''}">${esc(text)}</p></div></div>`;
}
$('#h-title').textContent = D.up.title;
const chars = D.script.replace(/\n/g,'').length;
$('#stats').innerHTML = [`${chars.toLocaleString()}자`, `약 ${Math.round(chars/470)}분 (470자/분)`, `챕터 ${D.ts.split('\n').length}개`].map(s=>`<span class="stat">${s}</span>`).join('');

$('#p-upload').innerHTML =
  block('제목', D.up.title) + block('설명글', D.up.desc) + block('태그', D.up.tags) + block('고정 댓글', D.up.pin);

$('#p-thumb').innerHTML =
  `<div class="block"><div class="bhead"><h2>제목 후보</h2></div><div class="list">${
    D.titles.map((x,i)=>`<div class="row"><div class="txt">${i===0?'<span class="tag">추천 · 대본 기준</span>':''}<div class="t">${esc(x.t)}</div><div class="n">${esc(x.note)}</div></div>${btn(x.t)}</div>`).join('')
  }</div></div>
  <div class="block"><div class="bhead"><h2>썸네일 문구</h2></div><div class="list">${
    D.thumbs.map((x,i)=>`<div class="row"><div class="txt">${i===0?'<span class="tag">추천</span>':''}<div class="t">${esc(x)}</div></div>${btn(x)}</div>`).join('')
  }</div></div>
  <p class="note">윗줄 흰색 · 아랫줄 노랑, 빨간 라벨은 「1952.5.7」. 지도 배경만 AI로 만들고 빨간 칸·글자는 편집 프로그램에서 얹습니다.</p>
  <div class="block"><div class="bhead"><h2>이미지 프롬프트</h2></div><div class="list">${
    D.prompts.map(x=>`<details><summary>${esc(x.label)}</summary><div class="row"><p class="prompt pre txt">${esc(x.p)}</p>${btn(x.p)}</div></details>`).join('')
  }</div></div>`;

$('#p-ts').innerHTML =
  block('챕터 목록', D.ts, {mono:true, label:'전체 복사'});

$('#p-script').innerHTML =
  `<div class="block"><div class="bhead"><h2>대본 전문 · 01_대본.txt</h2>${btn(D.script,'전문 복사')}</div>
   <div class="body script">${D.paras.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`;

document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if(!b) return;
  const text = store[+b.dataset.i], old = b.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(_) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){} ta.remove();
  }
  b.textContent = '복사됨'; b.classList.add('done');
  setTimeout(()=>{ b.textContent = old; b.classList.remove('done'); }, 1400);
});

const tabs = [...document.querySelectorAll('[role=tab]')];
function show(id){
  tabs.forEach(t=>{ const on = t.id===id; t.setAttribute('aria-selected', on); document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
  try{ localStorage.setItem('tab', id); }catch(_){}
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.id)));
try{ const s = localStorage.getItem('tab'); if(s && document.getElementById(s)) show(s); }catch(_){}
</script>

</body></html>
